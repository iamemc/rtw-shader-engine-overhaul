; RIS Graphics Engine (ReShade add-on): settings.
; Changes made in the ReShade overlay (Home key > RIS window > Graphics Engine tab) are saved here.
; See ../README.md.

[General]
Enabled=1

; ---- Engine Fixes ----
; All together: the reflection mip, water reflectance, the environment BRDF table, skin in shade, wet grass
; roughness, billboard local lights, small light culling, reflections that dim in shade, no lattice from the
; sky's distance noise, two specular lobes on skin, 16x anisotropic filtering and the tone-mapped MSAA resolve.
[EngineFixes]
Enabled=1

; Coloured occlusion on units (people and mounts): ambient light bounces between surfaces by their colour
; (multi-bounce occlusion, Jimenez 2016). Its own switch, independent of [EngineFixes], for testing. Only the
; ambient light changes: sun, contact and cloud shadows keep their full effect.
[ColouredOcclusion]
Enabled=1
; Buildings: the same multi-bounce occlusion on the lit building shaders (PBR), so creases in warm stone stay warm. Its own switch, independent of Enabled (units). 0: the game's, bit for bit.
Buildings=1

; Sunlight through leaves (thin-slab transmission): albedo x transmittance x the sun x its shadow, on leaves only. Replaces the
; game's view-dependent leaf glow. Mesh trees and their billboards. Its own switch, independent of [EngineFixes], for testing.
[LeafTransmission]
Enabled=1
; Its shadow is a path through foliage from the game's shadow maps: exp(-Density x metres). Density = G x leaf area density, per metre.
Strength=0.25
Density=1.01
; The first bounce of the light the crown stops, between leaves (greener). 0 off, 1 on.
Scattered=0

; Sunlight through grass blades, averaged over upright blades of every orientation (glows looking towards the sun). Its own
; switch, independent of [EngineFixes], for testing.
[GrassTransmission]
Enabled=1
Strength=1
Density=4
Scattered=1

[MountTranslucency]
; Sunlight through mounts' thin parts (ear rims, legs, outlines) seen against the sun. Artistic: physically invisible at the shadow maps' resolution.
Enabled=1
Strength=1
; The tissue is treated as Thinness times thinner than the shadow map measures (1 = physical).
Thinness=10
; Millimetres over which the thickness is averaged: how far the glow spreads and softens.
Spread=20

[SkinTranslucency]
; Sunlight through people's ears, fingers and other thin skin seen against the sun, on bare skin only. Artistic, as MountTranslucency.
Enabled=1
Strength=1
; The skin is treated as Thinness times thinner than the shadow map measures (1 = physical).
Thinness=10
; Millimetres over which the thickness is averaged: how far the glow spreads and softens.
Spread=10

; ---- Post-processing ----
; Each effect's debug view is in the panel (Off at each start, not saved): alternate with the game's every second (labelled on screen),
; or split screen, left half the game's (ToneMapping, MsaaResolve) / bloom only (Bloom).

[ToneMapping]
; The game's curve, exposure, grading LUT, vignette and dither, but bright colours roll towards white
; instead of being clipped per channel (no hue shift). Curve: 1 = the game's curve, hue-preserving;
; 2 = Minimal AgX; 3 = ACES 2.0; 4 = GT7.
Enabled=1
Curve=4
; 0 = tone-map by luminance, 1 = by the brightest channel.
SaturationKeep=1
; How fast colours brighter than white move towards white.
HighlightDesaturation=1.51
; AgX only.
AgxPunchy=1
AgxExposure=0.5
; ACES 2.0 only. 1 matches the game's shadows and mid-tones.
AcesExposure=1
; 1 = limit how far the picture darkens when bright light lifts the game's exposure. Off shows the game's full swing, up to about 5 stops
; with the sun in view. Not applied to the game's own curve or the left of the split view.
StableWhite=1
; The most it may darken, in stops (0.25..6).
StableWhiteStops=1.49
Gt7Exposure=1

[Bloom]
; The Jimenez 2014 chain in place of the game's thresholded bloom.
Enabled=1
; 0..0.5. The levels are now averaged, so a value saved before 2026-11-06 reads about 6 times weaker:
; 0.01 then is 0.06 now, but sky values are limited, so 0.03 is about right.
Strength=0.101
; Blue-noise dither on the bloom's write into the R11G11B10 scene buffer.
HdrDither=1
; 3..100. The brightest value the chain takes in, before decoding. 100 lets the physical sun disc (RIS TrueSky add-on, [Sun]
; PhysicalDisc=1, encoded 50 to 80) through whole. With trueSKY's own disc (PhysicalDisc=0, or no TrueSky add-on) the add-on holds it to the game's 3.
InputCap=100
; 0 = the Jimenez chain; 1 = FFT convolution with the kernel below.
Method=0
; 3..100. The same limit for the FFT (held to 30 with trueSKY's own disc).
FftInputCap=100
; The kernel: how much light goes into each part (each is relative to the others), and its shape.
FftGlow=1
FftGlowTail=3
; 0..8 lines through each bright source. 1 at angle 0 is a horizontal, anamorphic streak.
FftStreakCount=1
FftStreakStrength=0.25
FftStreakAngle=0
; A share of the screen's width.
FftStreakLength=0.15
; Pixels of the image the convolution runs on, a quarter of the render size at 1689 x 950.
FftStreakWidth=0.7
FftStreakSpread=0.3
; The starburst, 0 strength is none; under 3 blades is a round aperture.
FftStarBlades=6
FftStarStrength=0
FftStarRotation=0
FftStarScale=3
FftStarSpread=1

[LensFlare]
; Every ray traced through every surface of a real lens (the Angenieux double Gauss) each frame, FlareSim's method, for the sun,
; in place of the game's lens flare. Streaks and starburst are [Bloom] Method=1.
Enabled=1
; 1 is the brightness the lens's coatings and the sun's value in the scene give.
Intensity=0.5
; The coating: 0 = none (bare glass, near-white ghosts); 1 = a single quarter-wave magnesium fluoride film (magenta to purple ghosts),
; designed for CoatingWavelength nm (400..700).
Coating=1
CoatingWavelength=550
; Wavelengths traced per ghost, 3..11, seen through the CIE 1931 colour response. 3 exaggerates the colour.
SpectralSamples=7
; The most ghosts drawn, brightest first.
Ghosts=32
; The shape of the ghosts: 0..16 blades (under 3 is round), 0 straight blades .. 1 a circle, and degrees.
ApertureBlades=9
ApertureRoundness=0.5
ApertureRotation=0

[AmbientOcclusion]
; Ground-truth AO with a thickness per sample, with XeGTAO's depth chain and denoiser, in place of ASSAO. Needs the game's SSAO option on.
; Its debug view (panel, not saved) alternates with the game's or tints the affected area orange.
Enabled=1
Strength=1
RadiusMetres=0.99
ThicknessMetres=0.2
RadiusPixelsFar=64

[ContactShadows]
; 0 = the game's own depth (the Depth Bias relief changes only the AO); 1 = follow the relief too.
FollowRelief=1
; Bend Studio's screen-space shadow, 60 samples towards the sun through the depth buffer, merged into the sun mask's red channel.
; Its debug view (panel, not saved): alternate with the game's, tint the affected area cyan, Bend's wave index (should converge on the sun), or his edge mask.
Enabled=1
Strength=1
; How thick each pixel is assumed to be, as a share of its depth. Bend's default.
SurfaceThickness=0.005
; The depth step treated as an edge rather than filtered: tune with the panel's edge mask view. Bend's default.
BilinearThreshold=0.02
Contrast=4
; 1 = edge pixels cast no shadow: fewer stripes on flat ground at grazing light, thinner shadows on foliage.
IgnoreEdgePixels=1

[SkyCube]
; The reflection cube baked again from the game's HDR sky with real GGX filtering, and swapped in for lit shaders.
; Baked when the game bakes its own, so enable it before loading a battle.
Enabled=1
; Battles only: the average colour of the ground on screen, in place of the cube's flat colour below the horizon.
GroundColour=1
GroundStrength=1

[DepthBias]
; Bend Studio's Depth Bias: the terrain's texture detail in a copy of the depth, read by the AO and the contact shadows. Needs the game's SSAO on.
; Its debug view (panel, not saved) alternates without it or shows the height (orange up, blue down).
Enabled=1
; The relief is the height the terrain's normal maps describe, integrated once per normal map, in metres from the tile's size.
; Strength (0..3): 1 = that relief as it is (a few centimetres on stony ground, less on grass).
Strength=2.01
; How far from the camera the relief reaches (m, 10..5000): full strength to three quarters of it.
FadeMetres=5000

[DrawRecording]
; Last frame's building (PBR: buildings, siege engines) and vegetation draws kept with their state, for features that draw them again (relief maps,
; the building Depth Bias, the battle-map height field, shadow tiles). Nothing uses it yet, and it costs a batch of state reads per kept draw: off.
Buildings=0
Vegetation=0
; The most draws kept per frame for each (64..65536); further draws that frame are not kept.
BuildingsCap=4096
VegetationCap=8192

[WorldHeightField]
; The battle-map height field (item 29): the terrain, buildings and trees drawn once from above at battle load into a height map for shaders to read
; (street sky visibility and later features). Nothing reads it yet, so there is no change on screen; it turns the two recordings above on while it is on.
; It builds when the recording has been steady for half a second and the game's grass draw has given the terrain heights, over a few frames.
Enabled=1
; Texels along each side (512..4096, in steps of 256) and metres per texel (0.125..4): 2048 at 0.5 m covers 1024 m around the map's centre, 16 MiB.
Resolution=2048
TexelMetres=0.5

[WorldSkyVisibility]
; Street sky visibility (item 30): narrow streets, courtyards and gate passages get less sky light. From the height field above (it must be on: [WorldHeightField] Enabled=1)
; the add-on works out the share of the sky each place sees, and the lit shaders of buildings, terrain and vegetation scale their ambient light by it, combined with the
; screen-space ambient occlusion by the minimum, faded in with distance from the camera. Off by default.
Enabled=1
; 1 (item 38): soldiers and mounts get the same cut in their ambient light from the field at their position (needs Enabled=1 above, and uses its Strength, FadeStart and FadeEnd), so a soldier in a narrow
; street matches the darker street around him. Open ground and soldiers outside the field are unchanged. Off by default.
Units=1
; The visibility's power: 1 is the sky share seen, 0 leaves the ambient alone, above 1 darkens streets more.
Strength=3
; Nearer than FadeStart metres from the camera nothing changes; from FadeEnd metres on the full visibility applies, between them it fades in.
FadeStart=0
FadeEnd=500

[StreetReflectionOcclusion]
; Street reflection occlusion (item 32): streets and courtyards stop reflecting open sky. The add-on keeps, for every metre of the battle-map height field (it must be on:
; [WorldHeightField] Enabled=1), the horizon of its walls and hills in 16 directions; for every pixel of buildings, terrain and vegetation it compares the mirror reflection
; direction with it, and where it runs into a wall, however thin, the lit shaders dim the sky reflection (the cube sample) to about a quarter. Combined with the screen-space
; specular occlusion ([DirectionalAmbient] SpecularOcclusion) by the minimum. It fades in with distance from the camera between [WorldSkyVisibility] FadeStart and FadeEnd.
; Units are not affected. Off by default.
Enabled=1
; How much of the reflection a wall in its way takes: 1 the full cut, 0 none.
Strength=1

[IndirectLight]
; Screen-space bounce light (item 37): light bounces from what is on screen onto nearby surfaces (sunlit plaster warms the shaded side of a street, sunlit ground lights eaves and
; shield undersides, a burning roof lights the walls beside it). From the lit picture before the sky and fog and the depth, the add-on works out for every pixel the light it receives
; from the other visible surfaces; the lit shaders of buildings, terrain and vegetation add it to their ambient term in linear light (scaled by the material's ambient strength and
; occlusion, never by the sun's). The sky contributes nothing. It uses the previous frame's picture. Off by default.
Enabled=1
; 1 (stage 3): soldiers and mounts get the bounce light too (the same pass; needs the shared pass's settings below). Off by default.
Units=1
; 1: the light is gathered at half the screen's size each way (about a quarter of the cost) and upsampled against depth and normals; 0: at full size.
HalfRes=0
; How much of the light is added (0..8; 1 is the physical amount, above 1 is brighter than physical); a soft maximum keeps a bright source from feeding itself frame after frame.
Strength=2
; How far a surface can light another, in metres (1..30); the light falls off smoothly to nothing at this distance.
Radius=8

[TorchShadows]
; Torch and fire shadows (item 40): torches and fires stop lighting through walls. In each 16 x 16 pixel tile the lights that cover most pixels at the highest intensity
; (LightsPerTile of them) get a shadow ray per pixel: a short ray against the depth (props, soldiers, anything on screen) and a march through the battle-map height field
; (walls behind the camera or off the screen; needs [WorldHeightField] Enabled=1), combined by the minimum. The lit shaders of buildings, units, terrain and vegetation
; multiply that light by the shadow; every other light stays unshadowed (fire arrows, by design). Needs [TorchLights] Enabled=1 (or Reach above 1); it multiplies the physical falloff when Falloff=1 and the game's own
; falloff when it is 0. By day there are no lights and it costs nothing. Off by default.
Enabled=1
; Samples along each ray, of each kind (2..32): more catch thinner walls and props, and cost more.
Steps=32
; Lights with a shadow ray in each tile (1 or 2), the strongest first.
LightsPerTile=2
; 1: also march the height field, so walls off the screen shadow and corners stop leaking; 0: only the depth's rays.
WorldRays=1

[UpscaleSharpening]
; The game's CAS upscale, without sharpening what is only noise (the lattice in night skies).
; NoiseFloor, of 255: no sharpening up to here, full at 3 times this.
Enabled=1
NoiseFloor=2

[LensRain]
; Rain on the lens (item 59): drops on the camera's front glass in rain, drawn before the game's upscale (never on the interface), only in battles.
; Off by default. Amount scales how much rain reaches the lens (0 to 2). Force and the debug view are in the panel only.
Enabled=1
Amount=0.5

[TerrainSpecularAA]
; 1: the ground's highlight widens where its normal changes faster than a pixel can show, so sparkles stop shimmering.
Enabled=1

[TerrainHexTiling]
; Hex tiling of the ground textures (Mikkelsen 2022), which hides their repeats.
; Far: 1 = the distant ground, which the game already hex-tiles, blends its three tiles by contrast instead of evenly, and its normals as slopes.
Far=1
; Near: 1 = the near ground, which the game tiles plainly, gets the same hex grid. Four more texture reads per near-ground pixel.
Near=1
; How far each near-ground tile turns at random (0..1): 0 none, 1 any direction. At 1, sand ripples start to change direction from patch to patch.
Rotation=1

[UnitSpecularAA]
; 1: units' highlights widen where the normal map changes faster than a pixel can show, so armour shimmers less at a distance.
Enabled=1

[UnitFarNormals]
; 1: distant soldiers get their normal map back. The game's far unit shaders drop it, so highlights jump when a soldier changes detail level; this draws the far levels with the near shader's code.
Enabled=1
; 1: the roughness is also widened by the normal map's own variance at the level it is read at (Toksvig), so far soldiers keep a blurred sheen of their surface detail. Needs Enabled=1.
Toksvig=1

[UnitWeathering]
; 1: soldiers and mounts get dust, mud and blood as materials: grunge.tga's mask and the soldier's amounts (the game's, and the Soldier state's for dirt in fair weather) place them, the files in ris_battlemap/unit_grunge/ (dust_*, mud_*, blood_*) give their look, and a layer or a map you have not supplied keeps the game's grunge. Off: the game's picture bit for bit.
Enabled=1
; Scales the amounts (0 to 1).
Strength=1
; Tiles of each material across a soldier's uv (a uv is about two metres of him): 4 gives a tile of about half a metre, which suits a 1024 detail texture; blood is finer.
DustScale=4
MudScale=4
BloodScale=6

[UnitWetness]
; 1: wet soldiers: darker albedo and a smoother surface by what the soldier's own accumulated wetness holds above the game's rain value. Needs [UnitWeathering] Enabled=1 and the Soldier state.
Enabled=1
; Scales the darkening and the smoothing (0 to 1).
Strength=1

[Sheen]
; 1: soft rims on cloth and horse coats at low angles (Charlie sheen). On people only on rough non-metal clothing, away from skin and hair.
Enabled=1
; Strength (0..3).
Strength=0.25
; The same sheen in the sky's light, on the same cloth and coat mask: a soft rim in shade, overcast and at night, energy conserving (the cloth gives up the share the lobe reflects). Off by default. 0: the sun's term only, bit for bit.
Ambient=1
; Ambient sheen strength (0..3).
AmbientStrength=1

[ReflectionDominantDirection]
; 1: rough surfaces read the sky reflection nearer their normal (Filament's mix(r, n, alpha^2)).
Enabled=1

[ReflectionHorizon]
; 1: a normal-mapped reflection pointing below the surface goes dark (Marmoset's horizon occlusion).
Enabled=1

[SunHighlightEnergy]
; 1: the sun's specular without the 1/pi the game's diffuse doesn't have. On in the shipped settings: a look judged by eye.
Enabled=1
; Factor (1..3.14): 1 is the game.
Factor=3.142
; 1: torch and fire highlights get the same Factor (the light loop's own 1/pi taken out the same way). Off: the game's.
Torches=1

; 1: the multiscatter compensation divides by the directional albedo at F0 = 1 (scale + bias of the environment BRDF), as Filament does, instead of the material's own
; BRDF. The game's version over-brightens dielectric specular 1.1 to 3.7 times. Off: the game's, bit for bit. Judge it with [SunHighlightEnergy].
[EnergyCompensation]
Enabled=1

; 1: a normal map's strength scales its slopes (x and y over the unscaled z) instead of scaling x and y and rebuilding z, which flattens at strength 2.
; Buildings and units. Off: the game's, bit for bit.
[NormalStrength]
Enabled=1

; 1: far building highlights stop shimmering: the lit building shaders widen their roughness by the building normal map's own variance at the level it is read at (Toksvig), computed on the GPU the first time each map is seen. It acts after the game's wetness has set the roughness. Off: the game's, bit for bit.
[BuildingSpecularAA]
Enabled=1

; 1: snow on the up-facing parts of buildings (the lit PBR shaders' albedo and roughness blend toward snow): from the normal map's normal and the model's, the run-time height of tiling normal maps
; (recesses fill first), the world sky visibility and the bent normal (nothing under an eave), driven by the snow the TrueSky module's weather state has built up (falling snow adds to it, in winter it stays).
; The game swaps to winter texture variants with snow already baked in, so this doubles that snow on them: it is here to try. Off: the game's, bit for bit.
; Strength (0..1) scales the amount. WinterCover (0..1) is the least cover in the winter season even when no snow has fallen in this battle (0: only fallen snow counts).
[BuildingSnow]
Enabled=1
Strength=1
WinterCover=0

; 1: snow on soldiers and mounts as Building snow puts it on roofs: on up-facing parts (shoulders, helmet tops, shield rims, a horse's back and head) from the normal map's and the model's
; normals, nothing under an arch or an eave (the world sky visibility and the bent normal), driven by the same snow amount (the weather state's cover, at least [BuildingSnow] WinterCover in winter).
; Armour, cloth and leather take the full cover, skin and hair SkinShare of it (a thin dusting); mounts' coats take the full cover. Off: the game's, bit for bit.
; Strength (0..1) scales the amount. SkinShare (0..1) is the share of the cover that skin and hair take.
[UnitSnow]
Enabled=1
Strength=1
SkinShare=0

; 1: wet buildings from the weather state's accumulated wetness (it rises in rain, dries afterwards), in place of the game's all-or-nothing wet-stone step (the game's own porosity maths is kept:
; rough stone darkens more): darker and smoother, nothing wet under an eave (the world sky visibility and the bent normal), streaks on vertical faces that fade as the wall soaks, puddles on flat parts
; (recesses fill first, from the run-time height of the normal maps; none on atlas textures). Off: the game's, bit for bit.
; Strength (0..1) scales the wetness. Puddles and Streaks switch those two parts.
[BuildingWetness]
Enabled=1
Strength=1
Puddles=1
Streaks=1

; 1: the building (PBR) shaders build the normal map's frame from the position's derivatives, as the unit shader does, so relief no longer flattens at grazing views.
; Off: the game's, bit for bit.
[BuildingTangentFrame]
Enabled=1

; 1: the lit unit shaders shade back faces (cloak insides, shield backs) with the flipped normal, as the building shaders do. Off: the game's, bit for bit.
[UnitBackFaces]
Enabled=1

[TreeLodCrossfade]
; 1: a tree and its billboard fade into each other across the MSAA samples, in place of the game's speckled dither. Needs the game's MSAA; without it nothing changes.
Enabled=1
; Units. 1: a soldier's detail levels fade into each other across the MSAA samples, each soldier with a pattern of his own (from his record, not his slot), in place of the game's speckled dither. Needs the game's MSAA; the shadows keep the game's dither. Off: the game's, bit for bit.
Units=1

[FoliageCoverage]
; 1: leaf and grass edges get partial coverage across the MSAA samples, in place of the game's hard cut. Needs the game's MSAA; without it nothing changes.
Enabled=1
; 1: the unit depth shaders' alpha cut (hair and beard cards, plumes, fringes) gets the same coverage, in the pre-pass and the shadows. Off: the game's, bit for bit.
Units=1
; Units only. 1: the cut is a hash of the texture coordinate, not 0.5 (in the shadows too), so far cards keep their share. 0: the game's cut.
UnitHashed=1
; Units only. 1: edge pixels take the share of their MSAA samples the alpha edge covers (needs the game's MSAA). 0: all or none, as the game's.
UnitSharpen=1
; Buildings. 1: the PBR depth shaders' alpha cut (crenellations, fences, thatch, prop foliage) gets the same coverage, in the pre-pass and the shadows. Off: the game's, bit for bit.
Buildings=1
; Buildings only. 1: the cut is a hash of the texture coordinate, not 0.18 (in the shadows too), so far cards keep their share. 0: the game's cut.
BuildingHashed=1
; Buildings only. 1: edge pixels take the share of their MSAA samples the alpha edge covers (needs the game's MSAA). 0: all or none, as the game's.
BuildingSharpen=1

[TerrainColourVariation]
; 1: the ground's brightness and warmth vary in broad world-space patches, lighter and warmer together, so a repeated texture stops reading as one flat colour.
Enabled=1
; Strength (0..2): 1 is about 11 % lighter or darker, with a slight warm or cool shift.
Strength=2

[TerrainHeightBlend]
; 1: a ground layer's edge follows the relief of its own normal map, so stones and clumps stand out of the layer beneath, in place of the game's soft fade.
Enabled=1
; How strongly the relief moves the edge (0..4). 1 to 2 looks natural; above 2 some textures, snow among them, start to look streaky.
Strength=4

[TerrainGround]
; Colour from the slope and from where water would run, worked out from the battle's own heights. 1 = on, 0 = off.
Enabled=1
; Steep ground takes a cool grey from its own brightness. RockStart and RockRange are in (1 - the normal's up): 0.10 is about 26 degrees.
Rock=1
RockStrength=0.8
RockStart=0.2
RockRange=0.25
; Darker where water would run. Reaches 2,048 m from the centre.
Flow=1
FlowStrength=2
; Convex ground lighter, hollows darker
Ridges=1
RidgeStrength=2
; Paler, greyer on steep slopes that aren't cliffs
Scree=1
ScreeStrength=2
; Light the relief outside the battle per pixel. Also needs PerPixelNormals in ris_battlemap.ini
OuterNormals=1

[SkyEdgeFix]
; Silhouette pixels against the sky redone after the sky is drawn, from their own samples and the pixels around them. Needs the MSAA resolve.
Enabled=1

[Cmaa2]
; Intel's CMAA2 in place of the game's FXAA (needs FXAA selected in the game's options).
Enabled=1

[SunColour]
; Sun colour: the sun's light on units, mounts, buildings, terrain, grass and trees takes trueSKY's colour for the sun through the air (orange at low sun, white at noon)
; with the game's own brightness; only the hue changes. Needs the TrueSky add-on with its fog or light shafts on. Enabled=0 is the game's grey sun, bit for bit.
Enabled=1
; 0 the game's colour .. 1 trueSKY's full hue.
Strength=1

[TorchLights]
; Point lights (torches, fires): the game's slow frame-rate dependent flicker is replaced by an irregular flame flicker around each light's
; smoothed colour. Enabled=0 leaves the game's light records unchanged.
Enabled=1
; Intensity flicker, peak fraction of the colour (0..0.6).
FlickerAmount=0.1
; Scale on the 5 to 15 Hz band (0.25..3).
FlickerSpeed=0.4
; Radius flicker, peak fraction (0..0.2).
RadiusFlicker=0.05
; 1: replace the game's pinkish flame hue with a blackbody colour of Kelvin (1667..3500), at the same peak.
ColourTemperature=1
Kelvin=1802
; How far torches, fires and other point lights reach, as a multiple of the game's distance (1..5). 1 is the game's; the light at the flame keeps its strength.
Reach=5
; 1: the lit shaders compute torch and fire light in linear light: inverse-square falloff windowed to the radius, no light from behind a
; surface, darkened by the ambient occlusion. 0: the game's light loop exactly.
Falloff=1
; On the light (0..2). 1 matches the game's own light at a quarter of each light's radius on a night pixel, for every radius (the intensity grows with R^2 as the game's does), and falls
; physically beyond. Was 4 on the old single-radius calibration (0..4).
Strength=2
; The torch light x lerp(1, AO, this) (0..1). 0 leaves it unshadowed (the screen's AO over-darkens open ground).
AO=1

[ShadowResolve]
; The game's sun shadow resolve (CSMResolvePS b4f57dcf) rewritten: the same cascades, blends and second map, with a filter in metres.
; 0 leaves the game's shader bound, untouched.
Enabled=0
; The filter's radius on the ground in every cascade, centimetres (0..30). 0: the game's Poisson filter (a quarter of cb0[5].z atlas texels).
FilterRadius=15
; Vogel disk taps (0..32). 0: the game's count.
Taps=16
; Moves the point looked up along the surface's normal by this many of the cascade's texels x sin(angle to the sun), against acne (0..4).
NormalOffset=2
; 1: a depth-aware blur of the sun mask across and down, for the blue-noise filter's grain.
Denoise=1

[PCSS]
; The first cascades take their softness from the distance between blocker and surface: width = distance x 2 tan(sun angle / 2), 1 to 12 atlas texels of radius.
Enabled=1
; x 0.53 degrees (1..12). 1 is the real sun.
SunSize=1
; How many cascades get it, from the nearest (1..4).
Cascades=2
; Taps of the blocker search (4..32).
BlockerTaps=16

[DirectionalAmbient]
; The ambient colour every surface gets (t15, one flat value) becomes the sky's light along the surface's normal: the baked sky cube in nine spherical
; harmonics, the sun's disc left out, the mean over all directions calibrated to the game's t15. Needs [SkyCube] on; the bent normal needs the replacement AO.
; Enabled=0 is the game's flat ambient, bit for bit.
Enabled=1
; 0: the game's flat ambient. 1: the sky's nine harmonics.
Strength=1
; Look along the bent normal (the AO's mean open direction) instead of the surface's own.
BentNormals=1
; How far the normal for the sky term moves toward the bent normal (0..1).
BentStrength=1
; Evaluate the sky over the AO's visibility cone around that direction, floored at 0.4 of the open sky's value (the AO in t13 already dims it).
ConeVisibility=1
; Degrees around the sun left out of the harmonics, filled from a ring around it (1..40).
SunExclusion=12
; Local sun and moon bounce (item 35): the light the sunlit (or moonlit) walls and ground around a place send to it, worked out in the world from the battle-map height field (needs [WorldHeightField] on),
; so a shaded street beside a sunlit wall or plaza warms, including from off-screen and behind-camera surfaces. It is added to the lit shaders' ambient term in linear light like [IndirectLight].
; Sources nearer than [IndirectLight] Radius are left to the screen-space pass wherever that pass has data, so nothing is counted twice. Off by default.
LocalBounce=1
; How much of it is added (0..3).
LocalBounceStrength=3
; Specular occlusion by cone overlap (GTSO, Jimenez et al. 2016): the reflection of the sky is occluded by the overlap of its cone with the visibility cone around the bent normal,
; in place of the game's term (which with the game's roughness collapses to the AO). Open sky is unchanged. Needs the bent normal pass (BentNormals or ConeVisibility on) and the
; replacement AO; without them the game's term stays. SpecularOcclusion=0 is the game's term, bit for bit.
SpecularOcclusion=1
; 0: the game's term. 1: the cone overlap in its place (0..1).
SpecularOcclusionStrength=1
; The units' and the buildings' own switches (each also needs SpecularOcclusion=1).
SpecularOcclusionUnits=1
SpecularOcclusionBuildings=1
