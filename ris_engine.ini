[Lighting]
; The add-on's indirect light as layers (L2 of the fire, water and lighting plan): the sky term ([DirectionalAmbient]), the screen layer ([IndirectLight]) and the world layer
; ([WorldSkyVisibility], [DirectionalAmbient] LocalBounce, [StreetReflectionOcclusion]). A layer runs when Enabled, its switch here and its own section's switch are all on, so
; an ini without this section keeps its choices. Enabled=0 is the game's flat ambient.
Enabled=1
Screen=1
World=1
Sky=1
; 1: the lighting contract, one composition of the layers: the screen layer reports the share of each surface's view it resolved and the sky term and the world layer fill only
; the rest (E = E_screen + (1 - w) x [E_world + V_world x Sky]), in linear light, so the ground is counted once. Open ground is unchanged; sideways faces and undersides near
; the ground lose the doubled ground light. On by default.
Contract=1
; 1 (needs Contract): the per-direction fallback (L2a). The screen layer reports which of the directions it resolved are walls and roofs the height field holds too, so the
; sky term (V_world x Sky) and the local bounce fill only the directions it missed: a street floor keeps the sky its walls leave open instead of losing it twice, and a wall
; half off screen still lights the street from its other half. 0: one fraction (1 - w) for every direction. On by default.
DirectionalFallback=1
; 1: the linear final sum (L2b). Every lit family (units, buildings, terrain, trees, grass) adds the sun's or the moon's light to the rest of its light in linear light,
; encoded once, as the add-on's own lights do; shade, sunset and ambient-only pixels keep their value, sunlit and moonlit ones shift. 34 instructions per lit pixel (7 with it off).
; LinearSum=0 restores the pre-L2b look exactly (bit for bit, every family, every other setting). On by default.
LinearSum=1
; With LinearSum=1 only: the key light's scale in the linear sum (the game's light colour taken as linear light, times this), the sun by day and the moon at night, blended
; through dusk. 0.78 and 0.10 keep the lit families' mean brightness at the day captures (on average) and the night capture.
LinearSunScale=0.785
LinearMoonScale=0.255

[DirectionalAmbient]
; The ambient colour every surface gets (t15, one flat value) becomes the sky's light along the surface's normal: the baked sky cube in nine spherical
; harmonics, the sun's disc left out, the mean over all directions calibrated to the game's t15. Needs [SkyCube] on; the bent normal needs the replacement AO.
; Enabled=0 is the game's flat ambient, bit for bit.
Enabled=1
; 0: the game's flat ambient. 1: the sky's nine harmonics.
Strength=1
; Look along the bent normal (the AO's mean open direction) instead of the surface's own.
BentNormals=1
; How far the normal for the sky term moves toward the bent normal (0..1).
BentStrength=1
; Evaluate the sky over the AO's visibility cone around that direction, floored at 0.4 of the open sky's value (the AO in t13 already dims it).
ConeVisibility=1
; Degrees around the sun left out of the harmonics, filled from a ring around it (1..40).
SunExclusion=12
; Local sun and moon bounce (item 35): the light the sunlit (or moonlit) walls and ground around a place send to it, worked out in the world from the battle-map height field (needs [WorldHeightField] on),
; so a shaded street beside a sunlit wall or plaza warms, including from off-screen and behind-camera surfaces. It is added to the lit shaders' ambient term in linear light like [IndirectLight].
; Where the screen-space pass ([IndirectLight]) has data, sources beyond its Radius are added and nearer ones only beyond the light that pass already adds there,
; so nothing is counted twice and a wall it doesn't see still counts. Off by default.
LocalBounce=1
; How much of it is added (0..3).
LocalBounceStrength=1
; Specular occlusion by cone overlap (GTSO, Jimenez et al. 2016): the reflection of the sky is occluded by the overlap of its cone with the visibility cone around the bent normal,
; in place of the game's term (which with the game's roughness collapses to the AO). Open sky is unchanged. Needs the bent normal pass (BentNormals or ConeVisibility on) and the
; replacement AO; without them the game's term stays. SpecularOcclusion=0 is the game's term, bit for bit.
SpecularOcclusion=1
; 0: the game's term. 1: the cone overlap in its place (0..1).
SpecularOcclusionStrength=1
; The units' and the buildings' own switches (each also needs SpecularOcclusion=1).
SpecularOcclusionUnits=1
SpecularOcclusionBuildings=1


