; RIS Graphics Engine (ReShade add-on): settings.
; Changes made in the ReShade overlay (Home key > RIS window > Graphics Engine tab) are saved here.
; See ../README.md.

[General]
Enabled=1

; ---- Engine Fixes ----
; All together: the reflection mip, water reflectance, the environment BRDF table, skin in shade, wet grass
; roughness, billboard local lights, small light culling, reflections that dim in shade, no lattice from the
; sky's distance noise, two specular lobes on skin, 16x anisotropic filtering and the tone-mapped MSAA resolve.
[EngineFixes]
Enabled=1

; Coloured occlusion on units (people and mounts): ambient light bounces between surfaces by their colour
; (multi-bounce occlusion, Jimenez 2016). Its own switch, independent of [EngineFixes], for testing. Only the
; ambient light changes: sun, contact and cloud shadows keep their full effect.
[ColouredOcclusion]
Enabled=1
; Debug view: 0 off, 1 alternate with the game's (1 s), 2 the affected area (green), 3 the added light x20, 4 the multiplier per channel.
Debug=0

; Sunlight through leaves (thin-slab transmission): albedo x transmittance x the sun x its shadow, on leaves only. Replaces the
; game's view-dependent leaf glow. Mesh trees and their billboards. Its own switch, independent of [EngineFixes], for testing.
[LeafTransmission]
Enabled=1
; Debug view: 0 off, 1 alternate with the game's (1 s), 2 the leaves the test finds (green), 3 the added light x4, 4 the shadow it sees.
Debug=0
; Its shadow is a path through foliage from the game's shadow maps: exp(-Density x metres). Density = G x leaf area density, per metre.
Strength=0.25
Density=1.01
; The first bounce of the light the crown stops, between leaves (greener). 0 off, 1 on.
Scattered=1

; Sunlight through grass blades, averaged over upright blades of every orientation (glows looking towards the sun). Its own
; switch, independent of [EngineFixes], for testing.
[GrassTransmission]
Enabled=1
; Debug view: 0 off, 1 alternate with the game's (1 s), 2 the transmission geometry (green), 3 the added light x4, 4 the shadow it sees.
Debug=0
Strength=1
Density=4
Scattered=1

[MountTranslucency]
; Sunlight through mounts' thin parts (ear rims, legs, outlines) seen against the sun. Artistic: physically invisible at the shadow maps' resolution.
Enabled=1
; Debug view: 0 off, 1 alternate with the game's (1 s), 2 the side away from the sun (green), 3 the added light x4, 4 what the shadow map lets through.
Debug=0
Strength=1
; The tissue is treated as Thinness times thinner than the shadow map measures (1 = physical).
Thinness=10
; Millimetres over which the thickness is averaged: how far the glow spreads and softens.
Spread=20

[SkinTranslucency]
; Sunlight through people's ears, fingers and other thin skin seen against the sun, on bare skin only. Artistic, as MountTranslucency.
Enabled=1
; Debug view: 0 off, 1 alternate with the game's (1 s), 2 the skin away from the sun (green), 3 the added light x4, 4 what the shadow map lets through.
Debug=0
Strength=1
; The skin is treated as Thinness times thinner than the shadow map measures (1 = physical).
Thinness=10
; Millimetres over which the thickness is averaged: how far the glow spreads and softens.
Spread=10

; ---- Post-processing ----
; Debug: 0 = off, 1 = alternate with the game's every second (labelled on screen),
;        2 = split screen, left half the game's (ToneMapping, MsaaResolve) / bloom only (Bloom).

[ToneMapping]
; The game's curve, exposure, grading LUT, vignette and dither, but bright colours roll towards white
; instead of being clipped per channel (no hue shift). Curve: 1 = the game's curve, hue-preserving;
; 2 = Minimal AgX; 3 = ACES 2.0.
Enabled=1
Debug=0
Curve=4
; 0 = tone-map by luminance, 1 = by the brightest channel.
SaturationKeep=1
; How fast colours brighter than white move towards white.
HighlightDesaturation=1.51
; AgX only.
AgxPunchy=1
AgxExposure=0.5
; ACES 2.0 only. 1 matches the game's shadows and mid-tones.
AcesExposure=1
; 1 = limit how far the picture darkens when bright light lifts the game's exposure. Off shows the game's full swing, up to about 5 stops
; with the sun in view. Not applied to the game's own curve or the left of the split view.
StableWhite=1
; The most it may darken, in stops (0.25..6).
StableWhiteStops=1.5
Gt7Exposure=1

[Bloom]
; The Jimenez 2014 chain in place of the game's thresholded bloom.
Enabled=1
Debug=0
; 0..0.1. The levels are now averaged, so a value saved before 2026-11-06 reads about 6 times weaker:
; 0.01 then is 0.06 now, but sky values are limited, so 0.03 is about right.
Strength=0.101
; Blue-noise dither on the bloom's write into the R11G11B10 scene buffer.
HdrDither=1
; 3..100. The brightest value the chain takes in, before decoding. 100 lets the physical sun disc (RIS TrueSky add-on, [Sun]
; PhysicalDisc=1, encoded 50 to 80) through whole. 3 is the game's own, for trueSKY's non-physical disc: use it with PhysicalDisc=0.
InputCap=100
; 0 = the Jimenez chain; 1 = FFT convolution with the kernel below.
Method=0
; 3..100. The same limit for the FFT (30 or less with PhysicalDisc=0).
FftInputCap=100
; The kernel: how much light goes into each part (each is relative to the others), and its shape.
FftGlow=1
FftGlowTail=3
; 0..8 lines through each bright source. 1 at angle 0 is a horizontal, anamorphic streak.
FftStreakCount=1
FftStreakStrength=0.25
FftStreakAngle=0
; A share of the screen's width.
FftStreakLength=0.15
; Pixels of the image the convolution runs on, a quarter of the render size at 1689 x 950.
FftStreakWidth=0.7
FftStreakSpread=0.3
; The starburst, 0 strength is none; under 3 blades is a round aperture.
FftStarBlades=6
FftStarStrength=0
FftStarRotation=0
FftStarScale=3
FftStarSpread=1

[LensFlare]
; Every ray traced through every surface of a real lens (the Angenieux double Gauss) each frame, FlareSim's method, for the sun,
; in place of the game's lens flare. Streaks and starburst are [Bloom] Method=1.
Enabled=1
Debug=0
; 1 is the brightness the lens's coatings and the sun's value in the scene give.
Intensity=1
; The coating: 0 = none (bare glass, near-white ghosts); 1 = a single quarter-wave magnesium fluoride film (magenta to purple ghosts),
; designed for CoatingWavelength nm (400..700).
Coating=1
CoatingWavelength=550
; Wavelengths traced per ghost, 3..11, seen through the CIE 1931 colour response. 3 exaggerates the colour.
SpectralSamples=7
; The most ghosts drawn, brightest first.
Ghosts=32
; The shape of the ghosts: 0..16 blades (under 3 is round), 0 straight blades .. 1 a circle, and degrees.
ApertureBlades=9
ApertureRoundness=0.5
ApertureRotation=0

[AmbientOcclusion]
; Ground-truth AO with a thickness per sample, with XeGTAO's depth chain and denoiser, in place of ASSAO. Needs the game's SSAO option on.
; Debug: 0 off, 1 alternate with the game's, 2 tint the affected area orange.
Enabled=1
Debug=0
Strength=1
RadiusMetres=0.75
ThicknessMetres=0.25
RadiusPixelsFar=24

[ContactShadows]
; 0 = the game's own depth (the Depth Bias relief changes only the AO); 1 = follow the relief too.
FollowRelief=1
; Bend Studio's screen-space shadow, 60 samples towards the sun through the depth buffer, merged into the sun mask's red channel.
; Debug: 0 off, 1 alternate with the game's, 2 tint the affected area cyan, 3 Bend's wave index (should converge on the sun), 4 his edge mask.
Enabled=1
Debug=0
Strength=1
; How thick each pixel is assumed to be, as a share of its depth. Bend's default.
SurfaceThickness=0.005
; The depth step treated as an edge rather than filtered: tune with Debug=4. Bend's default.
BilinearThreshold=0.02
Contrast=4
; 1 = edge pixels cast no shadow: fewer stripes on flat ground at grazing light, thinner shadows on foliage.
IgnoreEdgePixels=1

[SkyCube]
; The reflection cube baked again from the game's HDR sky with real GGX filtering, and swapped in for lit shaders.
; Baked when the game bakes its own, so enable it before loading a battle. Debug: 0 or 1.
Enabled=1
Debug=0
; Battles only: the average colour of the ground on screen, in place of the cube's flat colour below the horizon.
GroundColour=1
GroundStrength=1

[DepthBias]
; Bend Studio's Depth Bias: the terrain's texture detail in a copy of the depth, read by the AO and the contact shadows. Needs the game's SSAO on.
; Debug: 0 off, 1 alternate without it, 2 show the height (orange up, blue down).
Enabled=1
Debug=0
; The relief is the height the terrain's normal maps describe, integrated once per normal map, in metres from the tile's size.
; Strength (0..3): 1 = that relief as it is (a few centimetres on stony ground, less on grass).
Strength=2
; How far from the camera the relief reaches (m, 10..5000): full strength to three quarters of it.
FadeMetres=5000

[UpscaleSharpening]
; The game's CAS upscale, without sharpening what is only noise (the lattice in night skies).
; NoiseFloor, of 255: no sharpening up to here, full at 3 times this.
Enabled=0
Debug=0
NoiseFloor=2

[TerrainSpecularAA]
; 1: the ground's highlight widens where its normal changes faster than a pixel can show, so sparkles stop shimmering.
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[TerrainHexTiling]
; 1: distant ground blends its hex tiles by contrast instead of evenly, and its normals as slopes.
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[UnitSpecularAA]
; 1: units' highlights widen where the normal map changes faster than a pixel can show, so armour shimmers less at a distance.
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[Sheen]
; 1: soft rims on cloth and horse coats at low angles (Charlie sheen). On people only on rough non-metal clothing, away from skin and hair.
Enabled=1
; Strength (0..3).
Strength=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[ReflectionDominantDirection]
; 1: rough surfaces read the sky reflection nearer their normal (Filament's mix(r, n, alpha^2)).
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[ReflectionHorizon]
; 1: a normal-mapped reflection pointing below the surface goes dark (Marmoset's horizon occlusion).
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[SunHighlightEnergy]
; 1: the sun's specular without the 1/pi the game's diffuse doesn't have. Off by default: a look to judge by eye.
Enabled=1
; Factor (1..3.14): 1 is the game.
Factor=3.142
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[TreeLodCrossfade]
; 1: a tree and its billboard fade into each other across the MSAA samples, in place of the game's speckled dither. Needs the game's MSAA; without it nothing changes.
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[FoliageCoverage]
; 1: leaf and grass edges get partial coverage across the MSAA samples, in place of the game's hard cut. Needs the game's MSAA; without it nothing changes.
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[TerrainColourVariation]
; 1: the ground's brightness and warmth vary in broad world-space patches, lighter and warmer together, so a repeated texture stops reading as one flat colour.
Enabled=1
; Strength (0..2): 1 is about 11 % lighter or darker, with a slight warm or cool shift.
Strength=2
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[TerrainHeightBlend]
; 1: a ground layer's edge follows the relief of its own normal map, so stones and clumps stand out of the layer beneath, in place of the game's soft fade.
Enabled=1
; How strongly the relief moves the edge (0..4). 1 to 2 looks natural; above 2 some textures, snow among them, start to look streaky.
Strength=4
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[TerrainGround]
; Colour from the slope and from where water would run, worked out from the battle's own heights. 1 = on, 0 = off.
Enabled=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0
; Steep ground takes a cool grey from its own brightness. RockStart and RockRange are in (1 - the normal's up): 0.10 is about 26 degrees.
Rock=1
RockStrength=0.8
RockStart=0.1
RockRange=0.2
; Darker where water would run. Reaches 2,048 m from the centre.
Flow=1
FlowStrength=1
; Convex ground lighter, hollows darker
Ridges=1
RidgeStrength=1
; Paler, greyer on steep slopes that aren't cliffs
Scree=1
ScreeStrength=1
; Light the relief outside the battle per pixel. Also needs PerPixelNormals in ris_battlemap.ini
OuterNormals=1

[TerrainNearHex]
; 1: near ground uses hex tiling too, which hides the repeats of its textures. Four more texture reads per near-ground pixel.
Enabled=1
; How far each near-ground tile turns at random (0..1): 0 none, 1 any direction. At 1, sand ripples start to change direction from patch to patch.
Rotation=1
; 0 off, 1 alternate with the game's (1 s).
Debug=0

[SkyEdgeFix]
; Silhouette pixels against the sky redone after the sky is drawn, from their own samples and the pixels around them. Needs the MSAA resolve.
Enabled=1
; Debug view: 0 off, 1 alternate with the game's (1 s), 2 the changed pixels (green).
Debug=0

[Cmaa2]
; Intel's CMAA2 in place of the game's FXAA (needs FXAA selected in the game's options).
Enabled=1
Debug=0

[TorchLights]
; Point lights (torches, fires): the game's slow frame-rate dependent flicker is replaced by an irregular flame flicker around each light's
; smoothed colour. Enabled=0 leaves the game's light records unchanged.
Enabled=1
; Intensity flicker, peak fraction of the colour (0..0.6).
FlickerAmount=0.1
; Scale on the 5 to 15 Hz band (0.25..3).
FlickerSpeed=0.4
; Radius flicker, peak fraction (0..0.2).
RadiusFlicker=0.05
; 1: replace the game's pinkish flame hue with a blackbody colour of Kelvin (1667..3500), at the same peak.
ColourTemperature=1
Kelvin=1900
; How far torches, fires and other point lights reach, as a multiple of the game's distance (1..5). 1 is the game's; the light at the flame keeps its strength.
Reach=2
; 1: the lit shaders compute torch and fire light in linear light: inverse-square falloff windowed to the radius, no light from behind a
; surface, darkened by the ambient occlusion. 0: the game's light loop exactly.
Falloff=0
; On the light, one intensity for every light, calibrated to the game's brightness on a typical surface 2 m from a torch (0..4).
Strength=4
; The torch light x lerp(1, AO, this) (0..1).
AO=0
; 0 off, 1 alternate with the game's (1 s), 2 the surfaces it changes, 3 the torch light alone x4, 4 the strongest light's falloff.
Debug=0

[ShadowResolve]
; The game's sun shadow resolve (CSMResolvePS b4f57dcf) rewritten: the same cascades, blends and second map, with a filter in metres.
; 0 leaves the game's shader bound, untouched.
Enabled=1
; The filter's radius on the ground in every cascade, centimetres (0..30). 0: the game's Poisson filter (a quarter of cb0[5].z atlas texels).
FilterRadius=10
; Vogel disk taps (0..32). 0: the game's count.
Taps=16
; Moves the point looked up along the surface's normal by this many of the cascade's texels x sin(angle to the sun), against acne (0..4).
NormalOffset=2
; 1: a depth-aware blur of the sun mask across and down, for the blue-noise filter's grain.
Denoise=1
; 0 off, 1 cascade index, 2 penumbra or filter radius (white: 12 atlas texels), 3 blockers found. Written to the mask instead of the shadow.
Debug=0

[PCSS]
; The first cascades take their softness from the distance between blocker and surface: width = distance x 2 tan(sun angle / 2), 1 to 12 atlas texels of radius.
Enabled=1
; x 0.53 degrees (1..12). 1 is the real sun.
SunSize=1
; How many cascades get it, from the nearest (1..4).
Cascades=2
; Taps of the blocker search (4..32).
BlockerTaps=16

[DirectionalAmbient]
; The ambient colour every surface gets (t15, one flat value) becomes the sky's light along the surface's normal: the baked sky cube in nine spherical
; harmonics, the sun's disc left out, the mean over all directions calibrated to the game's t15. Needs [SkyCube] on; the bent normal needs the replacement AO.
; Enabled=0 is the game's flat ambient, bit for bit.
Enabled=1
; 0: the game's flat ambient. 1: the sky's nine harmonics.
Strength=1
; Look along the bent normal (the AO's mean open direction) instead of the surface's own.
BentNormals=1
; How far the normal for the sky term moves toward the bent normal (0..1).
BentStrength=0.5
; Evaluate the sky over the AO's visibility cone around that direction, floored at 0.4 of the open sky's value (the AO in t13 already dims it).
ConeVisibility=1
; Degrees around the sun left out of the harmonics, filled from a ring around it (1..40).
SunExclusion=12
Debug=0
