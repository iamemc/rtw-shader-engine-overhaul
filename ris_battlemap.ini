; RIS Battlemap Features (ReShade add-on): settings.
; Changes made in the ReShade overlay (Home key > RIS window > Battlemap tab) are saved here,
; and edits to this file are picked up while the game runs. See README.md.

[General]
Enabled=1

[Blood]
; Blood decals stamped on the ground where soldiers die or are hit by missiles, kept for the rest of the battle.
Enabled=1
; The decal images are in ris_battlemap\fighting_decals beside this file: every DDS (BC7 colour, BC5 normal, BC4 roughness, with mips; or PNG, TGA, JPG, BMP, TIFF, where a DDS of the same name wins) in it is
; one decal, colour from RGB and shape from alpha. Up to 256; edited files reload by themselves.
; Beside each one, name_normal (or name_n) and name_roughness (or name_r) are its normal and
; roughness maps (see [Materials]).
; make_decal_textures.py --from <extracted decals\vfx> --out <that folder> converts game DDS decals.
; Chance that a soldier or horse that dies leaves blood under it (before the per-cell cap). A death is
; seen when the game starts its death animation; one within 0.5 m of an earlier death adds none. 0..1
DeathChance=1
; Chance that a missile hit leaves blood under it: an arrow the game stops where it struck a soldier,
; a horse or another animal (in flesh, armour or shield: blocked hits count), then removes. Arrows that
; miss land in the ground and leave none. 0..1
HitChance=1
; Most decals in one 2 x 2 m cell: keeps them separate splashes, never a carpet.
; Side of a decal in metres: each gets a random size between these.
SizeMin=0.8
SizeMax=2.5
; Seconds a new decal takes to spread from 40 % to its full size.
; Game minutes (standing still while paused) from fresh blood to fully dry: rougher (roughness at
; least 0.12 wet, 0.55 dry), slightly darker and browner. Thin spray and edges dry first, thick
; pools last; craters and burnt marks don't dry.
DryMinutes=5
; Most decals in a battle (32 bytes each on the GPU). They all stay: when full, no more are
; added. 65536 covers about 300 x 300 m at MaxPerCell=3.
MaxDecals=65536
; Side (pixels) of each decal texture in the add-on's texture array.
DecalSize=512
; Albedo multiplier: 1 = the texture's colour as it is. The ground's lighting is kept, and
; the blood is never brighter than its albedo x the sun and sky light.
Brightness=1
; Sky light as a share of the sun, for that limit. 0.3 matches the captured battles.
SkyLight=0.25
; Clear decals and arrows when no battle terrain has been drawn for this long: a loading
; screen or the campaign map, so the battle is over. Alt-tab does not count.
; Decals and arrows now clear when a new sky cube is baked (a battle or the campaign map loading), not after idle time.
Surfaces=1

[Arrows]
; Keep arrows stuck in the ground.
Enabled=1
; Seconds an arrow stays stuck. 0 = until the battle ends. Shorter than the game's own
; time also hides the game's arrows early (the overlay shows the game's own time).
StickSeconds=3600
; Most arrows kept at once; the oldest go first.
MaxArrows=20000
; Frames an arrow must stay in exactly the same place to count as stuck.
StableFrames=3

[Trees]
; Battle trees move in the wind. 1 = on, 0 = off (also off when the bend, Strength or Lean
; below, and Flutter are both 0: the game's own tree shaders are used then).
Enabled=1
; How far crowns bend: 1 = up to about 0.5 m at the top of a 28 m tree. 0 = no bend.
Strength=0.98
; Small, fast shaking of leaves and twigs away from the trunk. 0 = none.
Flutter=1
; The direction the wind blows towards, degrees from game +z towards game +x.
DirectionDeg=45
; How often the crowns rock back and forth (Hz).
RockHz=0.35
; Trees hold a lean downwind and sway around it, with gusts crossing the forest and a
; direction that wanders over time. 0 = the older motion above (Strength, RockHz).
Natural=1
; Natural wind: take speed and direction from the sky preset's clouds. 0, or no sky yet:
; a moderate wind towards DirectionDeg.
FromSky=1
; Natural wind: far billboard trees lean with the wind too, so a tree doesn't straighten up
; when it turns into one.
Billboards=1
; Natural wind: how far crowns lean. 1 = about 0.6 m at the top of a 28 m tree in 7 m/s.
Lean=2
; Natural wind: 1 = set the wind speed at the trees and grass yourself, with SpeedKmh below.
; 0 = take it from the sky preset.
ManualSpeed=0
; The wind speed when ManualSpeed is 1, in km/h, from 0 to 100. Gusts vary around it.
SpeedKmh=25

[Grass]
; With the trees' natural wind and FromSky on: grass leans the way the trees do. 0 = the game's
; own direction, which has nothing to do with the sky.
FollowSky=1

[TreeImpostors]
; Far billboard trees drawn as hemi-octahedral impostors baked from their lod0 mesh: right from every angle (from above too), lit as the
; mesh trees are (their normals, roughness, shadow and material). Needs ris_battlemap\RIS_impostors beside the add-on, written by
; ris_core\tools\impostor_baker\bake_impostors.py. Only RIS's trees: a record whose sprite pages differ from the bake keeps the game's
; billboards. 1 = impostors (the game's sprites only where no impostors were baked), 0 = the game's sprites (impostors only for
; records whose sprite pages are missing). The files may be plain DDS or packed in an LZ4 frame (impostor_pack.exe).
Enabled=1
; Impostors write their crown's own depth, so the game's shadow cascades, its shadow resolve, AO, contact shadows and fog treat them
; as they treat a mesh tree. The two below are fallbacks that stand in for those from the baked sky visibility; 0 (off) by default.
; BakedAO: how much it darkens the crown's ambient light (for screen AO). SelfShadow: how much it dims the sun on the crown (for the
; cascades' self-shadow). 1 full, 0 none.
BakedAO=1
SelfShadow=1
; Which tree meshes draw before the impostors: -1 the game's own distances (lod0 to 25 m, lod1 to 150 m, lod2 to 1000 m, then
; billboards), 0 lod0 then impostors, 1 lod0 and lod1, 2 lod0, lod1 and lod2, 3 impostors only (no tree meshes at any distance).
; Moves the game's LOD distances in memory (drawing only).
Lods=-1
; Where each mesh level stops (m), for the levels the mode uses.
Lod0To=200
Lod1To=300
Lod2To=400
; 1 = impostors tinted red; cards with no tree: blue none near, yellow foot 3 m or more from the card's bottom, magenta 5 cm to 1 m off
Coverage=1

[FarField]
; The game plants each climate's scrub record (the low trees of semi-arid, Mediterranean and temperate climates) only within about
; 1,024 m of the centre, so those trees end at a hard edge. This continues the record past that window as impostors, where the game's
; own 64 m ground says scrub, with the record's own layout, models and sizes. Needs [TreeImpostors]. 1 on, 0 off.
Enabled=1
; Density past the window against the game's own inside it (0..2): 1 the same, 2 double (the layout again, shifted half a tile).
; Above 1 the game's own forest past the window gets the forest record's layout again too, by the excess, fading in over 500 m.
Density=2
; 1: the land changes the density past the window (denser on pole-facing slopes and riverbanks in dry climates, bare on very steep and
; sun-facing slopes, thinner on ridges and toward 1,000 m, gaps), fading in over 500 m from the window. 0: the game's own rule everywhere.
Terrain=1
; On land outside the game's scrub and forest (0..1): this share of the scrub's density, times the share of the ground within 256 m
; that is the game's scrub or forest (open country stays open), fading in over 500 m from the window so the central square's open
; fields don't end at a line of trees. Density never raises it. 0 keeps to the game's scrub areas. Trees only: the record's
; rocks, stumps and stones are not planted out here.
OpenLand=1
; How far from the centre the scrub continues (m, 1024..5376): the game's forest window ends at 5,376 m.
ReachM=5376

[SoldierState]
; Follows every soldier and mount through the battle by the fingerprint in his t11 record (his slot changes every frame), keeping his time alive and
; moving, his blood, dust, mud and wetness, and offers a per-slot record to later shaders. No visible effect by itself: the unit weathering reads it. 1 = on.
Enabled=1
SnowSlides=1

[Capes]
; Capes on people follow the same wind as the trees, on top of their animation. Needs the
; trees' Natural wind. A cape with any metal above 0 in its material stays still. 1 = on.
Enabled=0
; How far a cape's hem moves (m) in a 7 m/s wind, doubling at most in strong wind.
Strength=0.15
; 1 = wolf, bear and lion skins worn like capes move too.
Pelts=0

[Butterflies]
; Butterflies, a dragonfly and a hawkmoth over the grass and by the trees the game draws, each
; species with its own size, wingbeat and flight. They rise from under the grass (or by trees)
; in view, fly with changing speed, gather into groups and scatter again, freeze while the game
; is paused, go when their grass or trees are no longer drawn, and are removed after
; UnseenSeconds out of view. 1 = on, 0 = off
Enabled=1
; Insects at once (0..128).
Count=32
; Scale on real sizes (wingspans: blue 3 cm, tortoiseshell 5, peacock 6, dragonfly 9.5,
; hawkmoth 11.5); each insect also varies by +-15%.
Size=2
; 0..1, scale on the wingbeat: each insect beats at 0.5-0.75 of its species' real rate
; (butterflies 8-12 per second, hawkmoth 27, dragonfly 30) times this. 0 = wings still.
FlapSpeed=1
; They spawn in view within this distance of the camera (m), and are removed beyond 1.5x.
SpawnRadius=60
; Out of view this long (s), an insect is removed and another spawns in view.
UnseenSeconds=5
; Preferred grass height (the game's grass map: 8 = normal grass, 16 = twice as tall); shorter
; grass gets a third as many.
LongGrassMin=12
; Grass blades the game draws in an 8 x 8 m cell for insects to spawn there (up to 1024).
MinBlades=32
; 1 = they cast shadows (drawn into the game's sun-shadow cascades; a 5-10 cm insect is about
; one shadow texel except near the camera).
Shadows=1

[Impacts]
; A crater where an onager rock (a smaller mark for a ballista or scorpion bolt) first meets the ground. Only the
; images named *diffuse* in the folders are used (they also hold normal and parallax maps); one is
; picked at random for each impact. Drawn by the blood decals' system (it works with blood off).
Enabled=1
; Relative to this file's folder (or a full path).
Folder=ris_battlemap\boulders_impact
; Burnt marks where fiery rocks land (without images there, fiery rocks use the crater images).
BurntFolder=ris_battlemap\boulders_impact_burnt
; Scale on the crater size (rocks 2-3 m, from the projectiles' area; bolts 0.6-1 m).
SizeScale=1
; How bright the craters and burnt marks are compared with the ground they cover (their lighting is kept),
; separate from the blood's Brightness. Without this key they take the blood's value.
Brightness=1
; 1 = impact decals in a solid colour by source: onager rock yellow, ballista or scorpion bolt cyan,

[Burning]
; Trees catch fire from fiery rocks (within 5 m) and from fires within 3 m of their leaves for 1.5 s (torches: TorchChance);
; the leaves burn 40 to 120 s (the first scorch within 2 s), the trunk keeps burning 1.5 to 2.5 times as long again, the wood
; then smoulders about 3 minutes and the tree stays burnt out (never re-ignites).
Enabled=1
; 1 = a burning tree loses its leaves (tips, top and the fire's side first) through scorched, charred and glowing bands,
; on the mesh trees, their impostors and their shadows alike. 0 = burning trees look as before.
Foliage=1
; 1 = a burning tree shows the game's own flame sprites (fire_anim) in its crown, on the burn line, moving onto the trunk once its
; leaves are gone; they show within 2 s, grow, hold and die down with the fire. At most 1200 flames, the nearest trees first. 0 = none.
Flames=1
; How fast the flame frames play, 0.25 to 3: 1 = the game's burning-building flames (each lives about 1.5 s, 32 frames); 1.75 = the old pace.
FlameSpeed=0.5
; The flames' size over the built-in one (which follows the fire's level and the crown, trunk or grass patch burning), 0.25 to 3.
FlameSize=0.5
; 1 = a burning tree's bark and branches char from the base up and from the burnt crown down, to 40 to 100 % of the tree (per tree),
; through a brown scorch and a thin glowing front; they stay opaque below the crown, only thin outer twigs burn away; a fire lit at the
; trunk climbs it (and the crown later, or never). Mesh trees and impostors alike. 0 = the wood looks as before.
Wood=1
; 1 = glowing cracks in the charred wood through the trunk's fire and its smouldering, and once burnt out a few dark-red ember spots
; that glow faintly until the battle ends (no light on anything else). 0 = none.
Embers=1
; 1 = burning trees give off smoke from the game's own puff sprites (fire_anim_smoke): heavy while the leaves burn, thinner from the
; trunk, a little while smouldering; at most 512 puffs, the nearest trees first. 0 = none.
Smoke=1
; How fast the smoke lives (its puffs' rise, growth, frames and fades), 0.25 to 2: 1 = the old pace, 0.75 a little slower.
SmokeSpeed=0.75
; 1 = grass burns in 2 m patches where the game grows it (fiery rocks, fires on the ground, burning trees above it, landed embers, rarely
; torches at the ground), spreading to the patches around by chance (downwind and uphill faster, slowed by rain, stopped by snow) and into
; low crowns; burnt blades shorten and char black with a ragged glowing line, low flames and thin smoke along the front in the trees'
; budgets; at most 6,000 patches burn at once. 0 = grass never burns.
Grass=1
; 1 = burning trees drop glowing embers that drift with the wind and land (glowing a moment on the ground), throw up short-lived
; sparks and let grey ash drift down: small streaks simulated on the GPU, at most 16,384 at once, the nearest trees first. 0 = none.
Particles=1
; 1 = the game's own burning buildings give off the same embers, sparks and ash (by their flames' size, in the same budget); their
; landed embers light grass or trees only very rarely. Torches give off none. 0 = only burning trees and grass. Needs Particles=1.
BuildingParticles=1
; Percent that a hot ember landing in an unburnt tree's leaves lights it (a wind-blown spot fire), 0 to 100, through the normal
; ignition rules and MaxBurning; tiny by default. 0 = embers never start fires.
SpotChance=0.1
; Trees burning at once, 0 to 256 (the burn look holds 256 burning trees; larger values are read as 256): a frame-time guard,
; the only cap that refuses a fire; at it a new ignition is refused, never queued. Flames keep their own budget (1200, nearest first).
MaxBurning=200
; Ignitions per battle; 0 = unlimited (a whole forest can burn, never as a guarantee: the spread chance decides).
MaxIgnitions=0
; Percent a second that a torch lights a tree while its flame is at the tree's leaves (within 0.5 m) or its trunk base (within 1 m
; of the trunk, under 3 m), 0 to 100. Fires (burning buildings, fiery rocks, burning trees) are not affected. 0 = torches never do.
TorchChance=0.2
; Percent a second that a burning tree at full flame lights each unburnt tree whose leaves lie within about 8 m of its own, 0 to 100,
; divided by N^3, N its unburnt neighbours within that calm reach: in a stand of touching crowns each neighbour gets a small share. At
; 30 a typical forest in calm air burns a patch (a tenth of a dense stand on average, now and then two thirds), a strong wind a third to
; a half (item 53 issue 3: 55 burnt dense stands whole half the time). Less the wider the
; gap, a quarter once only its trunk burns. The wind carries it downwind (more often and further, less upwind), it runs faster uphill, rain,
; wet leaves and winter slow it, a snow cover stops it, summer and arid climates speed it; rain also puts burning trees out early. No other
; limit: a whole forest can burn, never as a guarantee. 0 = fire never spreads from tree to tree.
SpreadChance=30
; Percent a second that a burning crown goes out part-way while its leaves burn, 0 to 100: it keeps the char and the leaves it has lost,
; then smoulders and goes out. Divided by 1 + the burning trees within about 8 m (their fire keeps it going) and by the weather (wet,
; rainy or snowy weather stops more crowns, summer and arid climates fewer). At 0.6 a lone crown in neutral weather stops part-way
; about 2 times in 5, one with three burning neighbours about 1 in 9. 0 = every crown burns to the end.
StopChance=0.6
; Seconds a tree smoulders after it is lit before its flames start, 0 to 60: the spot where it caught (its crown, or its trunk base for
; a torch) glows as embers and chars, thin smoke rises, then the flames start and grow with the burn, and the smoke thickens. Each tree
; takes 0.75 to 1.25 of this; wet, rainy or snowy weather makes it longer (up to 3 times), summer and arid climates shorter. A
; smouldering tree does not spread fire, and it can go out (StopChance) or be put out by rain before it flames. 0 = flames at once.
SmoulderSeconds=8
; Percent that one fire arrow (or scorpion or ballista fire bolt) crossing a tree's leaves lights it, 0 to 100. A crown rolls at most
; once a second, with 1 - (1 - chance)^n for the n arrows that crossed it in that second (n up to 8); times the weather (rain and wet
; leaves lower it, a snow cover refuses, summer and arid climates raise it). At 0.15 a dry 60-arrow volley into a forest lights about
; one tree. 0 = fire arrows light no tree.
ArrowTreeChance=0.15
; Percent that a fiery rock flying through a tree's leaves lights it, 0 to 100, times the weather (one roll a second per crown, however
; many rocks). Where a rock ends it still lights everything within 5 m, as before. 0 = rocks light no crown on the way.
RockTreeChance=60
; Percent that a fire arrow landing on grass lights the patch it lands in, 0 to 100: one roll, then the landed arrow is ignored (no
; rolls a second); times the weather. At 1.5 a dry 60-arrow volley lights about one grass patch. 0 = fire arrows light no grass.
ArrowGrassChance=1.5
; Trees fire arrows may light each second across the whole map, 0 to 256; the rest of that second's lucky crossings are refused.
; MaxBurning still holds for every fire.
ArrowMaxPerSecond=3
; Grass to grass, relative to the built-in rate (12 = 0.8 % a second per neighbour cell at full flame: a calm grass fire stays within tens
; of metres, a strong wind carries it downwind), 0 to 100. 0 = grass fires never spread.
GrassSpreadChance=12

[Materials]
; Normal and roughness maps beside the colour images of the decals and the butterflies, shaded like
; the game's terrain (a tangent-space normal map, roughness, a GGX sun highlight with F0 0.04).
; Names (.dds or .png): name or name_diffuse (colour), name_normal or name_n (normal),
; name_roughness or name_r (roughness, red). _parallax, _height, _ao, _specular are not used.
Normals=1
; Scale on the bumps.
NormalStrength=1
; 0 = DirectX normal maps (green down, as Total War textures), 1 = OpenGL (green up). Flip it if
; dents look raised.
NormalGreen=0
; Scale on the sun highlight (0 = none).
Specular=1
; Roughness of blood without a roughness map (low = wet and shiny), and of craters and burnt marks.
BloodRoughness=0.35
ImpactRoughness=0.85

[Projectiles]
; Rocks, bolts, javelins and pila that came to rest stay on the ground until the battle ends: when the
; game removes one, the add-on keeps drawing it with the game's own model and lighting.
Enabled=1
; Most kept at once.
MaxKept=8000

[FarTerrain]
; The Terrain tab. Past the 1,000 m gameplay grid the game's far mesh is coarser than its own heights: light it per pixel with the
; detail it leaves out (the heights' slope minus its local mean). Drawing only. Needs [TerrainGround] OuterNormals in ris_engine.ini.
; (The outer terrain generator, its new relief, ranges, rivers, lakes, erosion and tessellation, was removed on 2026-11-11.)
PerPixelNormals=1
; x the detail slope (0..3). 1 = the game's own heights as they are.
Strength=1



[Snow]
TreeSnow=1
VegetationSnow=1
