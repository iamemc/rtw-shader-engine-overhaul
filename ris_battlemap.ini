; RIS Battlemap Features (ReShade add-on): settings.
; Changes made in the ReShade overlay (Home key > RIS window > Battlemap tab) are saved here,
; and edits to this file are picked up while the game runs. See README.md.

[General]
Enabled=1

[Blood]
; Blood decals stamped on the ground where soldiers die or are hit by missiles, kept for the rest of the battle.
Enabled=1
; Folder of decal images, relative to this file: every PNG (or TGA, JPG, BMP, TIFF) in it is
; one decal, colour from RGB and shape from alpha. Up to 32; edited files reload by themselves.
; Beside each one, name_normal (or name_n) and name_roughness (or name_r) are its normal and
; roughness maps (see [Materials]). The old setting ris_battlemap\decals finds fighting_decals.
; make_decal_textures.py --from <extracted decals\vfx> --out <this folder> converts game DDS decals.
DecalFolder=ris_battlemap\fighting_decals
; Chance that a soldier or horse that dies leaves blood under it (before the per-cell cap). A death is
; seen when the game starts its death animation; one within 0.5 m of an earlier death adds none. 0..1
DeathChance=1
; Chance that a missile hit leaves blood under it: an arrow the game stops where it struck a soldier,
; a horse or another animal (in flesh, armour or shield: blocked hits count), then removes. Arrows that
; miss land in the ground and leave none. 0..1
HitChance=0.5
; Most decals in one 2 x 2 m cell: keeps them separate splashes, never a carpet.
MaxPerCell=3
; Side of a decal in metres: each gets a random size between these.
SizeMin=0.8
SizeMax=2.5
; Each decal gets a random opacity between this and 1.
OpacityMin=0.5
; Seconds a new decal takes to spread from 40 % to its full size.
GrowSeconds=4
; Most decals in a battle (32 bytes each on the GPU). They all stay: when full, no more are
; added. 65536 covers about 300 x 300 m at MaxPerCell=3.
MaxDecals=65536
; Side (pixels) of each decal texture in the add-on's texture array.
DecalSize=512
; Albedo multiplier: 1 = the texture's colour as it is. The ground's lighting is kept, and
; the blood is never brighter than its albedo x the sun and sky light.
Brightness=0.89
; Sky light as a share of the sun, for that limit. 0.3 matches the captured battles.
SkyLight=0.05
; Clear decals and arrows when no battle terrain has been drawn for this long: a loading
; screen or the campaign map, so the battle is over. Alt-tab does not count.
; Decals and arrows now clear when a new sky cube is baked (a battle or the campaign map loading), not after idle time.
; 0 off, 1 decal squares (yellow) and centres (red).
Debug=0

[Arrows]
; Keep arrows stuck in the ground.
Enabled=1
; Seconds an arrow stays stuck. 0 = until the battle ends. Shorter than the game's own
; time also hides the game's arrows early (the overlay shows the game's own time).
StickSeconds=0
; Most arrows kept at once; the oldest go first.
MaxArrows=20000
; Frames an arrow must stay in exactly the same place to count as stuck.
StableFrames=3

[Trees]
; Battle trees move in the wind. 1 = on, 0 = off (also off when the bend, Strength or Lean
; below, and Flutter are both 0: the game's own tree shaders are used then).
Enabled=1
; How far crowns bend: 1 = up to about 0.5 m at the top of a 28 m tree. 0 = no bend.
Strength=1
; Small, fast shaking of leaves and twigs away from the trunk. 0 = none.
Flutter=1
; The direction the wind blows towards, degrees from game +z towards game +x.
DirectionDeg=45
; How often the crowns rock back and forth (Hz).
RockHz=0.35
; Trees hold a lean downwind and sway around it, with gusts crossing the forest and a
; direction that wanders over time. 0 = the older motion above (Strength, RockHz).
Natural=1
; Natural wind: take speed and direction from the sky preset's clouds. 0, or no sky yet:
; a moderate wind towards DirectionDeg.
FromSky=1
; Natural wind: far billboard trees lean with the wind too, so a tree doesn't straighten up
; when it turns into one.
Billboards=1
; Natural wind: how far crowns lean. 1 = about 0.6 m at the top of a 28 m tree in 7 m/s.
Lean=2
; Natural wind: 1 = set the wind speed at the trees and grass yourself, with SpeedKmh below.
; 0 = take it from the sky preset.
ManualSpeed=0
; The wind speed when ManualSpeed is 1, in km/h, from 0 to 100. Gusts vary around it.
SpeedKmh=25

[Grass]
; With the trees' natural wind and FromSky on: grass leans the way the trees do. 0 = the game's
; own direction, which has nothing to do with the sky.
FollowSky=1

[Capes]
; Capes on people follow the same wind as the trees, on top of their animation. Needs the
; trees' Natural wind. A cape with any metal above 0 in its material stays still. 1 = on.
Enabled=1
; How far a cape's hem moves (m) in a 7 m/s wind, doubling at most in strong wind.
Strength=0.15
; 1 = wolf, bear and lion skins worn like capes move too.
Pelts=0

[Butterflies]
; Butterflies, a dragonfly and a hawkmoth over the grass and by the trees the game draws, each
; species with its own size, wingbeat and flight. They rise from under the grass (or by trees)
; in view, fly with changing speed, gather into groups and scatter again, freeze while the game
; is paused, go when their grass or trees are no longer drawn, and are removed after
; UnseenSeconds out of view. 1 = on, 0 = off
Enabled=1
; Insects at once (0..128).
Count=32
; Scale on real sizes (wingspans: blue 3 cm, tortoiseshell 5, peacock 6, dragonfly 9.5,
; hawkmoth 11.5); each insect also varies by +-15%.
Size=2
; 0..1, scale on the wingbeat: each insect beats at 0.5-0.75 of its species' real rate
; (butterflies 8-12 per second, hawkmoth 27, dragonfly 30) times this. 0 = wings still.
FlapSpeed=1
; They spawn in view within this distance of the camera (m), and are removed beyond 1.5x.
SpawnRadius=60
; Out of view this long (s), an insect is removed and another spawns in view.
UnseenSeconds=5
; Preferred grass height (the game's grass map: 8 = normal grass, 16 = twice as tall); shorter
; grass gets a third as many.
LongGrassMin=12
; Grass blades the game draws in an 8 x 8 m cell for insects to spawn there (up to 1024).
MinBlades=32
; 1 = they cast shadows (drawn into the game's sun-shadow cascades; a 5-10 cm insect is about
; one shadow texel except near the camera).
Shadows=1
; 1 = draw every insect solid bright red (unlit, with its wing shape), to find them.
Debug=0

[Impacts]
; A crater where an onager rock (a smaller mark for a ballista or scorpion bolt) first meets the ground. Only the
; images named *diffuse* in the folders are used (they also hold normal and parallax maps); one is
; picked at random for each impact. Drawn by the blood decals' system (it works with blood off).
Enabled=1
; Relative to this file's folder (or a full path).
Folder=ris_battlemap\boulders_impact
; Burnt marks where fiery rocks land (without images there, fiery rocks use the crater images).
BurntFolder=ris_battlemap\boulders_impact_burnt
; Scale on the crater size (rocks 2-3 m, from the projectiles' area; bolts 0.6-1 m).
SizeScale=1
; How bright the craters and burnt marks are compared with the ground they cover (their lighting is kept),
; separate from the blood's Brightness. Without this key they take the blood's value.
Brightness=1
; 1 = impact decals in a solid colour by source: onager rock yellow, ballista or scorpion bolt cyan,
; fiery rock orange. Blood is not affected.
Debug=0

[Materials]
; Normal and roughness maps beside the colour images of the decals and the butterflies, shaded like
; the game's terrain (a tangent-space normal map, roughness, a GGX sun highlight with F0 0.04).
; Names: name.png or name_diffuse.png (colour), name_normal.png or name_n.png (normal),
; name_roughness.png or name_r.png (roughness, red). _parallax, _height, _ao, _specular are not used.
Normals=1
; Scale on the bumps.
NormalStrength=1
; 0 = DirectX normal maps (green down, as Total War textures), 1 = OpenGL (green up). Flip it if
; dents look raised.
NormalGreen=0
; Scale on the sun highlight (0 = none).
Specular=1
; Roughness of blood without a roughness map (low = wet and shiny), and of craters and burnt marks.
BloodRoughness=0.35
ImpactRoughness=0.85

[Projectiles]
; Rocks, bolts, javelins and pila that came to rest stay on the ground until the battle ends: when the
; game removes one, the add-on keeps drawing it with the game's own model and lighting.
Enabled=1
; Most kept at once.
MaxKept=8000

[OuterTerrain]
; The Terrain tab. New terrain outside the battle area, built on the GPU: the map's broad shape, rivers, lakes and coasts kept, the rest new relief and water erosion.
; Drawn only: soldiers, pathfinding and the game's rules keep its own ground. 1 = on, 0 = off.
Enabled=1
; Trees and far billboards move with the ground. 0 is only for debugging.
Trees=1
; Relief: m of hills on all ground; extra relief per metre of the map's own relief (0.7 keeps mountains at their height on average); share of the map's own mountain shapes kept (0..1); largest hill spacing (m)
ReliefFloor=200
ReliefFromMap=1
MapPeaks=1
FeatureSize=1800
; Domain warping, ridge sharpness on high ground, share of mesas (all 0..1); terrace step (m, 0 off); hard and soft rock layers (0..1)
Warp=1
Ridges=1
Mesas=0.5
Terrace=5
Strata=1
; Water erosion: on or off, how hard it cuts (0..4), steps at 64 m (the finer grids take half each), how far river beds sink under standing water
Erosion=1
ErosionAmount=1
ErosionSteps=80
Riverbed=1.5
Tessellate=1
; Fine detail: relief below the grids, added in the shaders (0 off). Detail: edge spacing as a multiple of the grid (0.5 lets the fine detail show). MaxSplit: most splits per edge of the game's far mesh
FineDetail=1
Detail=0.5
MaxSplit=16
; Nothing moves inside this distance on either axis (m, at least 1000); the new terrain takes over FadeLength later
FadeStart=1000
FadeLength=500
; Fades to nothing this close to water (m)
WaterMargin=128
; Light the new relief per pixel. Needs [TerrainGround] OuterNormals in ris_engine.ini; off, the vertices carry the normals. 1 = on, 0 = off.
PerPixelNormals=0

MapOrientation=0
DistantRanges=1
RangeHeight=2500
RangeSize=3000
