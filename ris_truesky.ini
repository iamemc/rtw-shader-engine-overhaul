; RIS TrueSky: cloud lighting and cloud quality for Total War: ROME REMASTERED.
; Read by ris_truesky.addon64 (a ReShade add-on). Keep this file next to it.
;
; A key that is present sets that value. A key that is missing or commented out (;)
; is left to the game. The add-on re-reads this file about once a second, so you can
; edit it while a battle is running. The ReShade overlay (Home key) has a
; "RIS" window whose "TrueSky" tab has the same values and a "Save to ini" button.

[General]
; 0 = add-on does nothing
Enabled=1

[Fixes]
; 1 = the add-on's fixes (one switch; the overlay's "Fixes" list says which are working and why not):
;   sky and fog dither: the fog pass's writes into the scene get a blue-noise dither of up to half a step of
;     the scene buffer, against banding in smooth fog and sky gradients.
; (trueSKY's fades are always left alone while it bakes its sky cube, so the Low sky has no grid.) 0 = off
Enabled=1

[Water]
; 1 = cubic wave slopes close up, where a wave grid's cell covers two pixels or more: no flat facets in the reflections.
SmoothWaves=1
; 1 = each patch of sea reads the wave grids from a different offset, so the 400, 61 and 9.3 m tiles don't repeat as a lattice.
VariedWaves=1
; 1 = the water's surface doesn't take the contact shadows, which are worked out at the bed (the bed keeps them, seen through the water).
SurfaceShadow=1
; 1 = the sky light on the water's body dims under cloud by the same share as the ground (AmbientDarkness), so cloud shadows show on the water. 0 = only the sun's part dims
CloudShade=1
; The overlay's Water tab. Water's reflections are the scene from the game's planar reflections plus a sky cube.
; 1 = the sky drawn this frame (drifting clouds, the add-on's sky, auroras, lightning flashes) mirrored into the
; game's planar reflections, which skip the sky; only sky that is on screen can be mirrored. 0 = the cube only
LiveSky=1
; 1 = fill the planar reflections' interior holes (sky speckles in reflected trees and walls). 0 = off
FillHoles=1
; 1 = for directions off screen, a sky cube built every frame from trueSKY's own sky and clouds, as the sky above
; (moving clouds, the add-on's sky colours, lightning flashes). At Sky quality Low, where trueSKY draws no cloud cube,
; trueSKY's baked cube recoloured by the add-on's sky instead. 0 = trueSKY's cube as baked at battle load
SkyCube=1
; 1 = simulated waves (three FFT bands from an oceanographic spectrum) in place of the game's 4 scrolling normal maps. 0 = the game's
FftNormals=1
; 1 = the physical water material on the variants it knows (sun glitter from the waves, real reflectance, refraction that
; respects what stands above the water, water that darkens with depth). 0 = the game's shading
Material=1
; The waves: the weather's wind times this (0.1 to 3), the sea's fetch (km), the depth the sea's spectrum feels (m), swell 0 to 1,
; choppiness 0 to 2. InlandFetch and InlandDepth are the same for rivers and lakes (any water not at sea level), which have no swell
WindScale=1
Fetch=300
Depth=20
Swell=0.25
Choppiness=1
InlandFetch=3
InlandDepth=3
; What the water is (Jerlov types, measured coefficients): -1 from the climate, 0 IB (clear ocean), 1 II, 2 III, 3 1C (coastal), 4 3C, 5 5C (turbid),
; 6 a silty river (estimated coefficients).
; Type is the sea, InlandType rivers and lakes. Turbidity scales how much matter is in it (0.1 to 5)
Type=-1
InlandType=-1
Turbidity=1
; Backlit crests (0 to 5) and foam on breaking crests (0 to 5)
; 1 = the waves focus the sun into moving nets of light on the bed in shallow sunlit water; CausticStrength 0 to 2
Caustics=1
CausticStrength=1
CrestGlow=1
FoamCoverage=1

[Lighting]
; Values chosen in game with Cheat Engine. Game values in brackets.
; Sunlight on the clouds [1.0]
Direct=2
; Light scattered inside the clouds, 0 = deepest self-shadowing [0.6]
Indirect=0
; Sky fill on the shadowed side [1.0]; overcast and storm skies may want some back
Ambient=0
; How fast light dies inside a cloud, higher = darker cores [2.0]
Extinction=5
; Forward scattering, silver lining towards the sun, 0..0.99 [0.87]
MieAsymmetry=0.87

[Quality]
; Change one at a time and watch frame time. Suggested values after the "=".
; Edge of the cloud cubemap, 256..2048 (4096 crashes the game); 2048 is about 4x the raytrace cost [1024]
CubemapSize=2048
; 3D noise texture size, power of two, 16..256 [32]
Noise3DSize=64
; Raytrace step near the camera in km, 0.05..1 [0.4, 0.4]. H and V are tied:
; setting one sets both (if both are set, H wins). This is not only quality: trueSKY adds a
; fixed opacity each time a ray crosses a cell face (not scaled by distance), so larger cells
; mean fewer crossings: thinner, smokier clouds and visible bands where the crossing count
; changes. 0.25 removes most banding; 1 makes it strong. Costs GPU time as it gets smaller.
RaytraceCellH=0.25
RaytraceCellV=0.25
; Cloud volume width in km. Clouds are drawn only to 150 km, so 300 doubles the
; horizontal detail for free [600, 600]. X and Y are tied: setting one sets both
; (if both are set, X wins).
WindowWidthX=600
WindowWidthY=600
; Cloud volume texels, powers of two [1024, 32]; 64 high costs about +293 MiB VRAM
WindowTexelsXY=2048
WindowTexelsZ=32

[Detail]
; These shape cloud edges, not the cloud lighting (the lighting is sampled from the
; coarse volume without noise, so only Quality and Lighting values soften it).
; How far the detail noise distorts the cloud shape, km; larger hides the grid [3.0]
NoiseAmplitudeKm=5
; Tile size of the 3D noise, km; smaller = finer detail [3.0]
Noise3DPeriodKm=1.5
; Contrast of cloud edges, lower = softer edges [1.0]
AlphaSharpness=0.5

[CloudShadows]
; Shadows of the trueSKY clouds on terrain, units, buildings and trees. The add-on
; multiplies the game's sun-shadow term by the sunlight that gets through the clouds.
; 1 = on, 0 = off
Enabled=1
; 1 = the clouds' shadow is worked out once per frame into a map 16 km across around the camera
; (1024 x 1024, 15 m texels, refreshed as the clouds drift) and the ground
; reads it: about a third of the cost, the same shadows, edges softened by one texel (about a real
; cloud shadow's penumbra). Ground off the map or up in the clouds is traced per pixel. 0 = every
; pixel traced through the clouds
UseMap=1
; 1 = the whole map is refreshed every frame, so the shadows follow the clouds smoothly (about 0.25 ms);
; 0 = a quarter of it each frame: cheaper, the shadows move in small steps
MapEveryFrame=1
; With MapEveryFrame=1: 1 = only the part of the map this frame's view can read is drawn (about a quarter of it,
; the same shadows), 0 = all of it
MapViewOnly=1
; The near map's edge in texels: 1024 (15.6 m), 512 (31 m, softer edges, about 4 x cheaper) or 256 (62 m, blurry edges, about
; 20 x cheaper). The far map is half of it
MapResolution=1024
; How dark the cloud shadows are, 0..10: 0 = no shadow, 1 = clouds block the sun as much
; as they look opaque, higher = darker. Only ground under visible cloud is shaded; gaps stay
; sunlit. On its own, the darkest it gets is a tree's shadow: the sun is blocked.
Darkness=1
; Share of the sky light also removed under full cloud shadow, 0..1 (it darkens the game's
; ambient occlusion). 0 = only the sun is blocked; 1 = under thick cloud, sky light is gone
; too, which is darker than any shadow the game draws. Needs the game's ambient occlusion on.
AmbientDarkness=0.5
; How strong the shadows stay with the sun below the horizon, 0..1: they fade to this as the sun
; sets. 0 = none at night, 1 = as strong as by day.
NightStrength=0.15
; Blur of the shadow edges (cloud volume mip level), 0..3; 0 = as sharp as the clouds
Softness=0
; Debug view drawn over the final image: 0 = off,
; 1 = coloured overlay (yellow light, orange medium, magenta heavy shadow; white lines
;     are a 1 km grid that must stay fixed to the ground when the camera moves),
; 2 = the same, but for the clouds straight overhead (ignores the sun direction)
Debug=0

[Rainbow]
; trueSKY never draws its rainbow in this game; the add-on draws a physically placed one:
; primary bow at 40.4-42.4 degrees from the point opposite the sun (red outside), secondary
; at 50.4-53.9 degrees (colours reversed), brighter sky inside, darker band between. It
; appears when the preset's rain ('precipitation') is falling, the sun is behind you and
; below about 40 degrees, and sunlight reaches the rain. Its strength is the sunlit rain
; between you and the ground or cloud base, so it fades over nearby ground and its pieces
; stay with the rain showers. It is drawn just before trueSKY's
; rain, so the rain falls in front of it. 1 = on, 0 = off
Enabled=1
; 0..5
Brightness=1
; Band width, 0.5..3; larger = smaller drops: softer, paler bows
Width=1
; Outer bow strength, 0..1 (physically about 0.4)
Secondary=0.4
; Debug: 1 = ignore rain and clouds, to see the bow with or without rain (look away from a low sun)
Force=0
; 1 = an arc standing on the battlefield: terrain hides its base, and it stays put as the
; camera moves. 0 = a true optical rainbow centred on the camera (it travels with you, as a
; real one does, so you can never approach it).
Anchored=1
; Anchored arc: distance from the map centre on the side away from the sun, km (1..20); its
; radius is about 0.9x this, so from the map centre it spans the true 42 degrees
DistanceKm=2
; Anchored arc: height of its centre, km (-1..2); lower = more of it below the ground
BaseKm=0

[Aurora]
; trueSKY 4.3 added aurorae; the game has 4.2, so the add-on draws green curtains itself
; (red tops, vertical rays, slow folding), just before trueSKY's cloud composite, so clouds,
; haze and fog cover them as they cover the stars. Each battle rolls once whether it gets one, from the
; game's own battle state and the loaded sky:
;   chance = Chance_<climate> x winter x dark x weather x clear x haze x fog
;   winter: 0 in summer.  dark: midnight and night 1, mid_evening MidEveningFactor, others 0,
;   and the sun must be below -6 degrees (full below -12).  weather: calm 1, hazy HazyFactor,
;   everything else 0 (and no layer may have precipitation).  clear, haze, fog: 1 at or below
;   the *Full value, 0 at or above the *None value (max layer cloudiness, sky Haze, GroundFog).
; The overlay shows every factor, the chance and the roll. 1 = on, 0 = off
Enabled=1
; Debug: 1 = draw it now, ignoring every condition (in daylight it is drawn but too faint to see)
Force=0
; 0..20, scaled by trueSKY's star brightness so it shows at night; 1 = a fifth of the first
; version's level (that filled the sky with saturated green)
Brightness=1
; Light the aurora casts on the ground, units and buildings at night, stronger on slopes facing
; the display, dimmed under cloud (the cloud shadows' Darkness, needs [CloudShadows] on), softened
; by haze and fog; dark ground gets some too. 0..20: 0 = off, 1 = physical: an active display
; overhead adds about 4% to the moonlight on snow, quiet arcs under 1% (nearly invisible);
; 8 = a visible green cast. Independent of Brightness.
TerrainLight=8
; Light the aurora casts on the clouds at night, a green tint on otherwise dark cloud on moonless
; nights. 0..20: 0 = off, 1 = physical and faint (2 to 5 % of moonlit cloud).
CloudLight=2
; The side of the sky the arcs lie on, degrees from game +z towards game +x
NorthAzimuthDeg=0
CloudinessFull=0.35
CloudinessNone=0.55
HazeFull=20
HazeNone=60
GroundFogFull=0.15
GroundFogNone=0.3
HazyFactor=0.5
MidEveningFactor=0.5
; Chance (%) on a dark, clear winter night. Real odds run from 10-20% of nights near 55 deg
; magnetic latitude to about 1% near 45 deg and 0.1% near 40 deg; highland uses the arctic
; daytypes (the far north), sub_arctic is North Africa and the Eastern Mediterranean in RIS,
; semi_arid is Iran and Asia Minor.
Chance_default=0
Chance_sandy_desert=0
Chance_rocky_desert=0
Chance_temperate_grassland_fertile=0.5
Chance_temperate_grassland_infertile=3
Chance_temperate_forest_open=3
Chance_temperate_forest_deep=5
Chance_swamp=3
Chance_highland=12
Chance_alpine=1.5
Chance_sub_arctic=0
Chance_semi_arid=0
; How far from the battlefield the centre of the band of arcs lies, km (the band is ~60 km
; wide when quiet, ~200 km when active, arcs ~60 km apart): 0 = straight overhead,
; 200 = over half the sky, 450 = low over one horizon. Varied 0.6-1.4x per battle; strong
; aurorae come up to 40% closer.
OvalKm_default=200
OvalKm_sandy_desert=200
OvalKm_rocky_desert=200
OvalKm_temperate_grassland_fertile=450
OvalKm_temperate_grassland_infertile=200
OvalKm_temperate_forest_open=200
OvalKm_temperate_forest_deep=100
OvalKm_swamp=200
OvalKm_highland=0
OvalKm_alpine=300
OvalKm_sub_arctic=200
OvalKm_semi_arid=200

[Lightning]
; Lightning in storm battles, drawn by the add-on (trueSKY's own preset storms drew nothing in
; game): rain_storm a strike every ~12 s, rain_drizzle about one a minute, no other weather;
; each lands under thick storm cloud within MinDistanceKm and MaxDistanceKm, anywhere around you (none
; if there is no thundercloud in reach). Each strike: a branching bolt over the clouds (hidden behind
; nearer hills and units), a flash on the sky and the ground, and thunder. The overlay says
; whether the current battle has lightning and has a "Force a strike" button. 1 = on, 0 = off
Enabled=1
; 0..5: how strongly a bolt lights the terrain, soldiers and buildings for a moment (a stroke
; and two return strokes, ~0.4 s; nearer bolts more). 1 = a near bolt at night lights snow
; about as much as the moon; by day it is 15 % of that. 0 = no flash.
FlashBrightness=1
; How strongly strikes prefer storm cloud near the camera: cloud this many km further out counts about
; 2.7 times less. Smaller = nearer strikes (3 gives a median near 5 km). 0 = no preference, where
; most strikes land far out (median near 8.5 km), simply because there is more area there.
FalloffKm=3
MinDistanceKm=0.5
MaxDistanceKm=12
; 1 = thunder: a random WAV from ThunderFolder after each bolt, delayed by its distance at
; 343 m/s near you, compressed further out (1 km 2 s, 5 km 5 s), and quieter far away. The add-on ships no sounds: put 16-bit PCM .wav files there.
Thunder=1
; 0..1
ThunderVolume=1
; Relative to this file's folder (or a full path).
ThunderFolder=ris_battlemap\thunder

[Atmosphere]
; A physically based sky in place of trueSKY's own (Nishita-style, day-blue at sunset): trueSKY's
; three sky tables (transmittance, single scattering, skylight) are replaced right after it draws
; them with Hillaire 2020's multiple scattering and García Liñán's 4-wavelength spectral sky with
; ozone, in the preset's medium and the game's own brightness. Orange and pink sunsets, purple
; twilight, bluer haze by day. 1 = on, 0 = trueSKY's own sky
MultiScattering=1
; 0..1: 1 = the physically based sky, 0 = trueSKY's own; in between, a blend
Strength=1
; The haze profile used only until trueSKY's sky constants are seen (then the preset's own)
HazeBaseKm=0.4
HazeScaleKm=1
; The stratospheric aerosol layer around 22 km (peak extinction, km^-1 at 550 nm) that gives
; twilight its purple light, strongest with the sun 2-6 degrees down. 0 = none, 0.0015 = default,
; 0.005 or more = as after a volcanic eruption
StratosphericAerosol=0.0015
; 0 = measured ozone at four wavelengths (default: the purple comes from the high-altitude haze
; above, peaking 2-6 degrees after sunset, then blue hour); 1 = Hillaire 2020's ozone colours (green
; absorbed most: stronger violet from sunset on, as in his paper and Unreal's sky)
HillaireOzone=1
; The haze's single-scattering albedo: how much of the light it intercepts it scatters (the rest
; it absorbs). Real haze and dust 0.85-0.95; lower keeps more contrast on clouds and terrain in
; hazy weather. 1 = trueSKY's (no absorption)
HazeAlbedo=0.9
; Artistic: the share of multiply scattered light (every bounce after the first). Below 1, distant
; clouds and hills keep more contrast in hazy weather, and the open sky gets slightly dimmer and
; less blue. 1 = physical
MultipleScatteringStrength=1

[Sun]
; 1 = the sun's disc at its physical brightness: trueSKY writes it at its linear radiance into a scene
; the game reads as gamma-encoded, so it came out about 10^10 times the sky (a real sun is about 2 x 10^5)
; and clipped. On, it is encoded like the sky (with the sun's limb darkening), so bloom, lens flare and fog
; see its real light. Use with the engine add-on's [Bloom] InputCap=100; with 0, set InputCap back to 3.
PhysicalDisc=1

[HeightFog]
; Exponential height fog in place of trueSKY's fog (a slab of even density with a hard top): densest
; at the floor, thinning smoothly with height, lit by the sun through the atmosphere (glowing towards
; it) and by the sky; trueSKY's own fog colour at night. Its strength is each sky's GroundFog; the
; scale height is 100 m in light fog, 200 m in dense fog, the sky's FogCeilingKm otherwise.
; 1 = on, 0 = trueSKY's own fog
Enabled=1
; 1 = the fog's floor is a blurred copy of the battlefield (the game's terrain heights), so it
; gathers in hollows and valleys and thins over ridges; 0 = one flat floor at the map's low ground
TerrainFollow=1
; How broad the land shapes are that the floor follows (100..1000 m): hollows narrower than this
; fill with fog, wider ones are followed
FloorRadiusMetres=1000
; 1 = the two values below in place of the sky's fog, in any weather (clear skies too)
ForceFog=0
; Visibility at the floor (100..20000 m): extinction = 3.912 / visibility
ForceVisibilityMetres=1000
; Where the fog has thinned to 5 % of its density at the floor (20..2000 m)
ForceHeightMetres=300
; 1 = a low layer that drifts with the wind: dawn mist in calm, hazy or light fog over humid ground
; (night to mid-morning, burning off as the sun climbs past 5 to 20 degrees; weaker in the evening),
; and blowing snow in blizzards and snowfall; 0 = none
Mist=1
; Multiplier on the mist layer's density (0..3)
MistStrength=1
; 1 = the game's particles (smoke, dust, fire, sparks) are seen through the fog: they fade into it with
; distance as the ground does; 0 = drawn as the game draws them, over the fog
FogOnParticles=1
; 1 = the game's own mist sprites (DynamicFog) are lit with the fog's light (sun through the
; atmosphere, the sky) and fade into dense fog, so they match it; 0 = the game's colour
RelitMist=1
; 1 = each part of the fog takes its own sunlight from the cloud-shadow map ([CloudShadows]):
; towards the sun through broken cloud, gaps light bright shafts and cloud shadows leave dark lanes
; (about 0.1 to 0.4 ms more in fog); 0 = the whole fog takes the screen's mean sunlight
CloudShafts=1
; 1 = the farthest terrain fades into the fog over the sky, so there is no hard step at the horizon. A ridge close to you against the sky keeps its outline.
HorizonBlend=1
; Where that starts, as a share of the distance to the farthest ground on screen (0.1 to 0.95).
HorizonBlendStart=0.5
; 0 off, 1 alternate with trueSKY's fog every second, 2 show the fog's opacity in grey
Debug=0

[Wind]
; Clouds travel with the preset's wind. trueSKY moves the clouds by the wind times the sky time
; that has passed, but the game keeps the sun (and so the sky time) fixed in battle, so they
; never travel. With this on, each cloud layer moves at its preset wind_speed (m/s) along its
; wind_direction (radians in the .sq: 90 deg = 1.5708) over real time. The sun and the weather
; stay as the battle set them. Every layer needs "OverrideWind": "false" in the .sq: with it on,
; trueSKY ignores the wind and the layer can't travel (the overlay flags such layers).
; 1 = on, 0 = off
Enabled=1
; Multiplier on the preset's wind_speed, 0..10 (1 = physical)
SpeedScale=1

[LightShafts]
; Sun rays through gaps in the clouds, in the air, at any angle to the sun, with or without the height fog.
; 1 = on. Shadowed columns lose trueSKY's sunlit haze; lit ones gain light of their own. About 0.4 to 1 ms at half size.
Enabled=1
; How much light the lit columns gain. 0 = only the shadowed columns' physical loss, faint away from the sun.
; Above 0 is a deliberate departure from physics, so that shafts read clearly side-on.
LitStrength=1
; How thick the air the lit columns light up is, per km, with the sky's own haze height.
Extinction=0.2
; 1 = march at a quarter of the full size instead of half (cheaper).
QuarterResolution=0
; Sun beams through gaps in tree crowns, in the air near the camera, from the game's own sun
; shadows. Needs the cloud light shafts on. 1 = on, 0 = off.
Trees=1
; Their gain. 1 reaches the sun's own in-scatter through thick air.
TreeStrength=1
; How thick the air the beams light up is (per metre).
TreeDensity=0.015
; How far from the camera the beams go (m).
TreeReach=100
; Beams are full strength from looking into the sun round to this angle from it (degrees), then
; fade to nothing over the next 50, so they don't show looking away from the sun.
TreeFadePast=120
; Beams are full while the camera is up to this high (m) above the ground it looks at, then fade
; to nothing over the next 25 m, so a forest seen from high above has none.
TreeFadeAbove=15
