; RIS TrueSky: cloud lighting and cloud quality for Total War: ROME REMASTERED.
; Read by ris_truesky.addon64 (a ReShade add-on). Keep this file next to it.
;
; A key that is present sets that value. A key that is missing or commented out (;)
; is left to the game. The add-on re-reads this file about once a second, so you can
; edit it while a battle is running. The ReShade overlay (Home key) has a
; "RIS" window whose "TrueSky" tab has the same values and a "Save to ini" button.

[General]
; 0 = add-on does nothing
Enabled=1

[Lighting]
; Values chosen in game with Cheat Engine. Game values in brackets.
; Sunlight on the clouds [1.0]
Direct=2
; Light scattered inside the clouds, 0 = deepest self-shadowing [0.6]
Indirect=0
; Sky fill on the shadowed side [1.0]; overcast and storm skies may want some back
Ambient=0
; How fast light dies inside a cloud, higher = darker cores [2.0]
Extinction=5
; Forward scattering, silver lining towards the sun, 0..0.99 [0.87]
MieAsymmetry=0.87

[Quality]
; Change one at a time and watch frame time. Suggested values after the "=".
; Edge of the cloud cubemap, 256..2048 (4096 crashes the game); 2048 is about 4x the raytrace cost [1024]
CubemapSize=2048
; 3D noise texture size, power of two, 16..256 [32]
Noise3DSize=64
; Raytrace step near the camera in km, 0.05..1 [0.4, 0.4]. H and V are tied:
; setting one sets both (if both are set, H wins). This is not only quality: trueSKY adds a
; fixed opacity each time a ray crosses a cell face (not scaled by distance), so larger cells
; mean fewer crossings: thinner, smokier clouds and visible bands where the crossing count
; changes. 0.25 removes most banding; 1 makes it strong. Costs GPU time as it gets smaller.
RaytraceCellH=0.25
RaytraceCellV=0.25
; Cloud volume width in km. Clouds are drawn only to 150 km, so 300 doubles the
; horizontal detail for free [600, 600]. X and Y are tied: setting one sets both
; (if both are set, X wins).
WindowWidthX=600
WindowWidthY=600
; Cloud volume texels, powers of two [1024, 32]; 64 high costs about +293 MiB VRAM
WindowTexelsXY=2048
WindowTexelsZ=32

[Detail]
; These shape cloud edges, not the cloud lighting (the lighting is sampled from the
; coarse volume without noise, so only Quality and Lighting values soften it).
; How far the detail noise distorts the cloud shape, km; larger hides the grid [3.0]
NoiseAmplitudeKm=5
; Tile size of the 3D noise, km; smaller = finer detail [3.0]
Noise3DPeriodKm=1.5
; Contrast of cloud edges, lower = softer edges [1.0]
AlphaSharpness=0.5

[CloudShadows]
; Shadows of the trueSKY clouds on terrain, units, buildings and trees. The add-on
; multiplies the game's sun-shadow term by the sunlight that gets through the clouds.
; 1 = on, 0 = off
Enabled=1
; How dark the cloud shadows are, 0..10: 0 = no shadow, 1 = clouds block the sun as much
; as they look opaque, higher = darker. Only ground under visible cloud is shaded; gaps stay
; sunlit. On its own, the darkest it gets is a tree's shadow: the sun is blocked.
Darkness=1
; Share of the sky light also removed under full cloud shadow, 0..1 (it darkens the game's
; ambient occlusion). 0 = only the sun is blocked; 1 = under thick cloud, sky light is gone
; too, which is darker than any shadow the game draws. Needs the game's ambient occlusion on.
AmbientDarkness=0.5
; Blur of the shadow edges (cloud volume mip level), 0..3; 0 = as sharp as the clouds
Softness=0
; Debug view drawn over the final image: 0 = off,
; 1 = coloured overlay (yellow light, orange medium, magenta heavy shadow; white lines
;     are a 1 km grid that must stay fixed to the ground when the camera moves),
; 2 = the same, but for the clouds straight overhead (ignores the sun direction)
Debug=0

[Rainbow]
; trueSKY never draws its rainbow in this game; the add-on draws a physically placed one:
; primary bow at 40.4-42.4 degrees from the point opposite the sun (red outside), secondary
; at 50.4-53.9 degrees (colours reversed), brighter sky inside, darker band between. It
; appears when the preset's rain ('precipitation') is falling, the sun is behind you and
; below about 40 degrees, and sunlight reaches the rain. Its strength is the sunlit rain
; between you and the ground or cloud base, so it fades over nearby ground and its pieces
; stay with the rain showers. It is drawn just before trueSKY's
; rain, so the rain falls in front of it. 1 = on, 0 = off
Enabled=1
; 0..5
Brightness=1
; Band width, 0.5..3; larger = smaller drops: softer, paler bows
Width=1
; Outer bow strength, 0..1 (physically about 0.4)
Secondary=0.4
; 1 = ignore rain and clouds, to see the bow geometry in any weather (still needs rain drawn)
Force=0
; 1 = an arc standing on the battlefield: terrain hides its base, and it stays put as the
; camera moves. 0 = a true optical rainbow centred on the camera (it travels with you, as a
; real one does, so you can never approach it).
Anchored=1
; Anchored arc: distance from the map centre on the side away from the sun, km (1..20); its
; radius is about 0.9x this, so from the map centre it spans the true 42 degrees
DistanceKm=2
; Anchored arc: height of its centre, km (-1..2); lower = more of it below the ground
BaseKm=0

[Aurora]
; trueSKY 4.3 added aurorae; the game has 4.2, so the add-on draws green curtains itself
; (red tops, vertical rays, slow folding), just before trueSKY's cloud composite, so clouds,
; haze and fog cover them as they cover the stars. Each battle rolls once whether it gets one, from the
; game's own battle state and the loaded sky:
;   chance = Chance_<climate> x winter x dark x weather x clear x haze x fog
;   winter: 0 in summer.  dark: midnight and night 1, mid_evening MidEveningFactor, others 0,
;   and the sun must be below -6 degrees (full below -12).  weather: calm 1, hazy HazyFactor,
;   everything else 0 (and no layer may have precipitation).  clear, haze, fog: 1 at or below
;   the *Full value, 0 at or above the *None value (max layer cloudiness, sky Haze, GroundFog).
; The overlay shows every factor, the chance and the roll. 1 = on, 0 = off
Enabled=1
; Debug: 1 = draw it now, ignoring every condition (in daylight it is drawn but too faint to see)
Force=0
; 0..20, scaled by trueSKY's star brightness so it shows at night; 1 = a fifth of the first
; version's level (that filled the sky with saturated green)
Brightness=1
; Light the aurora casts on the ground, units and buildings at night, stronger on slopes facing
; the display, dimmed under cloud (the cloud shadows' Darkness, needs [CloudShadows] on), softened
; by haze and fog; dark ground gets some too. 0..20: 0 = off, 1 = physical: an active display
; overhead adds about 4% to the moonlight on snow, quiet arcs under 1% (nearly invisible);
; 8 = a visible green cast. Independent of Brightness.
TerrainLight=8
; The side of the sky the arcs lie on, degrees from game +z towards game +x
NorthAzimuthDeg=0
CloudinessFull=0.35
CloudinessNone=0.55
HazeFull=20
HazeNone=60
GroundFogFull=0.15
GroundFogNone=0.3
HazyFactor=0.5
MidEveningFactor=0.5
; Chance (%) on a dark, clear winter night. Real odds run from 10-20% of nights near 55 deg
; magnetic latitude to about 1% near 45 deg and 0.1% near 40 deg; highland uses the arctic
; daytypes (the far north), sub_arctic is North Africa and the Eastern Mediterranean in RIS,
; semi_arid is Iran and Asia Minor.
Chance_default=0
Chance_sandy_desert=0
Chance_rocky_desert=0
Chance_temperate_grassland_fertile=0.5
Chance_temperate_grassland_infertile=3
Chance_temperate_forest_open=3
Chance_temperate_forest_deep=5
Chance_swamp=3
Chance_highland=12
Chance_alpine=1.5
Chance_sub_arctic=0
Chance_semi_arid=0
; How far from the battlefield the centre of the band of arcs lies, km (the band is ~60 km
; wide when quiet, ~200 km when active, arcs ~60 km apart): 0 = straight overhead,
; 200 = over half the sky, 450 = low over one horizon. Varied 0.6-1.4x per battle; strong
; aurorae come up to 40% closer.
OvalKm_default=200
OvalKm_sandy_desert=200
OvalKm_rocky_desert=200
OvalKm_temperate_grassland_fertile=450
OvalKm_temperate_grassland_infertile=200
OvalKm_temperate_forest_open=200
OvalKm_temperate_forest_deep=100
OvalKm_swamp=200
OvalKm_highland=0
OvalKm_alpine=300
OvalKm_sub_arctic=200
OvalKm_semi_arid=200

[Lightning]
; Lightning in storm battles, drawn by the add-on (trueSKY's own preset storms drew nothing in
; game): rain_storm a strike every ~12 s, rain_drizzle about one a minute, no other weather;
; each lands under thick storm cloud 0.5-12 km away, anywhere around you (none if there is no
; thundercloud in reach). Each strike: a branching bolt over the clouds (hidden behind
; nearer hills and units), a flash on the sky and the ground, and thunder. The overlay says
; whether the current battle has lightning and has a "Force a strike" button. 1 = on, 0 = off
Enabled=1
; 0..5: how strongly a bolt lights the terrain, soldiers and buildings for a moment (a stroke
; and two return strokes, ~0.4 s; nearer bolts more). 1 = a near bolt at night lights snow
; about as much as the moon; by day it is 15 % of that. 0 = no flash.
FlashBrightness=1
; 1 = thunder: a random WAV from ThunderFolder after each bolt, delayed by its distance at
; 343 m/s near you, compressed further out (1 km 2 s, 5 km 5 s), and quieter far away. The add-on ships no sounds: put 16-bit PCM .wav files there.
Thunder=1
; 0..1
ThunderVolume=1
; Relative to this file's folder (or a full path).
ThunderFolder=ris_battlemap\thunder

[Atmosphere]
; A physically based sky in place of trueSKY's own (Nishita-style, day-blue at sunset): trueSKY's
; three sky tables (transmittance, single scattering, skylight) are replaced right after it draws
; them with Hillaire 2020's multiple scattering and García Liñán's 4-wavelength spectral sky with
; ozone, in the preset's medium and the game's own brightness. Orange and pink sunsets, purple
; twilight, bluer haze by day. 1 = on, 0 = trueSKY's own sky
MultiScattering=1
; 0..1: 1 = the physically based sky, 0 = trueSKY's own; in between, a blend
Strength=1
; The haze profile used only until trueSKY's sky constants are seen (then the preset's own)
HazeBaseKm=0.4
HazeScaleKm=1
; The stratospheric aerosol layer around 22 km (peak extinction, km^-1 at 550 nm) that gives
; twilight its purple light, strongest with the sun 2-6 degrees down. 0 = none, 0.0015 = default,
; 0.005 or more = as after a volcanic eruption
StratosphericAerosol=0.0015
; 0 = measured ozone at four wavelengths (default: the purple comes from the high-altitude haze
; above, peaking 2-6 degrees after sunset, then blue hour); 1 = Hillaire 2020's ozone colours (green
; absorbed most: stronger violet from sunset on, as in his paper and Unreal's sky)
HillaireOzone=0
; The haze's single-scattering albedo: how much of the light it intercepts it scatters (the rest
; it absorbs). Real haze and dust 0.85-0.95; lower keeps more contrast on clouds and terrain in
; hazy weather. 1 = trueSKY's (no absorption)
HazeAlbedo=0.9
; Artistic: the share of multiply scattered light (every bounce after the first). Below 1, distant
; clouds and hills keep more contrast in hazy weather, and the open sky gets slightly dimmer and
; less blue. 1 = physical
MultipleScatteringStrength=1

[Wind]
; Clouds travel with the preset's wind. trueSKY moves the clouds by the wind times the sky time
; that has passed, but the game keeps the sun (and so the sky time) fixed in battle, so they
; never travel. With this on, each cloud layer moves at its preset wind_speed (m/s) along its
; wind_direction (radians in the .sq: 90 deg = 1.5708) over real time. The sun and the weather
; stay as the battle set them. Every layer needs "OverrideWind": "false" in the .sq: with it on,
; trueSKY ignores the wind and the layer can't travel (the overlay flags such layers).
; 1 = on, 0 = off
Enabled=1
; Multiplier on the preset's wind_speed, 0..10 (1 = physical)
SpeedScale=1
